<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Johnny PMU – Les petits jeux What the fuck</title>
<meta name="description" content="Les mini-jeux de Johnny PMU : humour franchouillard, jouables directement sur ton téléphone.">
<meta property="og:title" content="Johnny PMU – Les mini-jeux">
<meta property="og:description" content="Des petits jeux absurdes, jouables directement dans ton navigateur.">
<meta name="theme-color" content="#14110f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
<style>
  :root{
    --bg:#14110f; --panel:#1f1a16; --line:#3a2f26; --text:#f4ece1; --muted:#b9a993;
    --accent:#f2b134; --accent2:#e4572e; --green:#3fae6a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text)}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;line-height:1.5;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(242,177,52,.14), transparent 70%),
      var(--bg);
  }
  .wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}
  .banner{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line);box-shadow:0 10px 40px rgba(228,87,46,.25)}
  header{text-align:center;padding:26px 0 34px}
  .perks{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}
  .perks span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
  .letsgo{margin-top:20px;font-family:"Arial Black","Impact",system-ui,sans-serif;font-size:clamp(20px,5vw,26px);color:var(--accent2);transform:rotate(-2deg)}
  .badge{
    display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin-bottom:18px;
  }
  h1{
    font-family:"Arial Black","Impact",system-ui,sans-serif;
    font-size:clamp(28px,7vw,52px);line-height:1.1;letter-spacing:-.01em;
  }
  h1 span{color:var(--accent)}
  .tagline{color:var(--muted);font-size:clamp(16px,3.6vw,19px);margin:16px auto 0;max-width:560px}
  .section-title{
    display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin:10px 0 16px;
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;text-decoration:none;color:inherit;
    transition:transform .15s ease,border-color .15s ease;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .thumb{
    aspect-ratio:16/10;display:grid;place-items:center;font-size:64px;
    background:linear-gradient(135deg,#2a211b,#3b2a1e);border-bottom:1px solid var(--line);
  }
  .thumb img{width:100%;height:100%;object-fit:cover}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .body h3{font-size:18px}
  .body p{color:var(--muted);font-size:14px;flex:1}
  .play{
    align-self:flex-start;margin-top:6px;background:var(--accent);color:#1a1208;
    font-weight:800;font-size:14px;padding:9px 16px;border-radius:10px;
  }
  .empty{
    border:1px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted);
  }
  .empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
  .plays{color:var(--accent);font-size:13px;font-weight:700;min-height:1em}
  .visits{display:inline-block;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;color:var(--text)}
  .visits:empty{display:none}
  footer{margin-top:48px;text-align:center;color:var(--muted);font-size:13px}
  footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <img class="banner" src="banniere.jpg" width="1600" height="595" alt="Johnny PMU">
    <header>
      <h1>Les petits jeux <span>What the fuck</span><br>de Johnny PMU</h1>
      <div class="perks">
        <span>📱 Joue depuis ton téléphone</span>
        <span>🚫 Pas d'inscription</span>
        <span>👆 Tu cliques, tu joues</span>
      </div>
      <p class="letsgo">Let's go ma poule ! 🐔</p>
    </header>

    <div class="section-title">Les jeux</div>
    <main id="games" class="grid"></main>

    <footer>
      <div id="visits" class="visits"></div><br>
      © <span id="y"></span> Johnny PMU · Jeux faits maison, humour garanti
    </footer>
  </div>

<script>
  /* ============================================================
     LISTE DES JEUX
     Pour ajouter un jeu : mettre son dossier dans le dépôt
     (ex. ricard-parfait/index.html) puis ajouter une ligne ici.
     ============================================================ */
  const GAMES = [
    { titre: "Le Ricard Parfait", dossier: "ricard-parfait", emoji: "🥃", description: "Sers un jaune à Johnny : dose parfaite ou catastrophe au comptoir ?" },
  ];

  const el = document.getElementById("games");
  if (!GAMES.length) {
    el.outerHTML = '<div class="empty"><strong>Les premiers jeux arrivent bientôt 🍻</strong>Repasse dans pas longtemps.</div>';
  } else {
    el.innerHTML = GAMES.map(g => `
      <a class="card" href="${g.dossier}/">
        <div class="thumb">${g.image ? `<img src="${g.image}" alt="">` : (g.emoji || "🎮")}</div>
        <div class="body">
          <h3>${g.titre}</h3>
          <p>${g.description || ""}</p>
          <span class="plays" data-jeu="${g.dossier}"></span>
          <span class="play">▶ Jouer</span>
        </div>
      </a>`).join("");
  }
  document.getElementById("y").textContent = new Date().getFullYear();

  /* ============================================================
     COMPTEURS (service gratuit Abacus, sans compte)
     - visites : +1 à chaque arrivée sur l'accueil (1 fois par session)
     - parties : comptées dans chaque jeu par compteur.js
     ============================================================ */
  const API = "https://abacus.jasoncameron.dev";
  /* Coup de pouce au démarrage : ajouté au vrai chiffre à l'affichage.
     (Les vrais chiffres restent dans Abacus : /get/johnnypmu/visites, etc.) */
  const BONUS = { visites: 121, "ricard-parfait": 124 };
  const fmt = n => Number(n).toLocaleString("fr-FR");
  const getVal = url => fetch(url).then(r => r.ok ? r.json() : null).then(d => d && d.value).catch(() => null);

  let dejaCompte = false;
  try { dejaCompte = sessionStorage.getItem("visiteComptee") === "1"; } catch (e) {}
  getVal(`${API}/${dejaCompte ? "get" : "hit"}/johnnypmu/visites`).then(v => {
    if (v == null) return;
    try { sessionStorage.setItem("visiteComptee", "1"); } catch (e) {}
    v += BONUS.visites || 0;
    document.getElementById("visits").textContent = `👀 ${fmt(v)} visite${v > 1 ? "s" : ""}`;
  });

  document.querySelectorAll(".plays[data-jeu]").forEach(el => {
    getVal(`${API}/get/johnnypmu/parties-${el.dataset.jeu}`).then(v => {
      v = (v || 0) + (BONUS[el.dataset.jeu] || 0);
      el.textContent = `🎮 ${fmt(v || 0)} partie${v > 1 ? "s" : ""} jouée${v > 1 ? "s" : ""}`;
    });
  });
</script>
</body>
</html>
