<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fayot Airlines – Johnny PMU</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#140a06;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;box-shadow:0 0 50px #000}
</style>

<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(()=>{
const W=540,H=960,CAM=240,VH=H-CAM,INK='#1b0f0c',SKIN='#f2b080',FONT='Bangers, Impact, sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S=1,DPR=1,t=0;

/* ---------- utils ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let r=Math.imul(a^a>>>15,1|a);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296;}}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const easeOutBack=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);};
function rrPath(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function ink(c,fill,lw=4){if(fill){c.fillStyle=fill;c.fill();}c.lineWidth=lw;c.strokeStyle=INK;c.lineJoin='round';c.lineCap='round';c.stroke();}
function txt(c,s,x,y,size,fill,o={}){
  c.save();c.translate(x,y);if(o.rot)c.rotate(o.rot);
  c.font=size+'px '+FONT;c.textAlign=o.align||'center';c.textBaseline='middle';c.lineJoin='round';
  if(o.max){const w=c.measureText(s).width;if(w>o.max){const k=o.max/w;c.scale(k,k);}}
  const lw=o.lw!=null?o.lw:size*0.18;
  if(o.shadow){c.lineWidth=lw;c.strokeStyle=o.shadow;c.strokeText(s,5,6);c.fillStyle=o.shadow;c.fillText(s,5,6);}
  c.lineWidth=lw;c.strokeStyle=o.stroke||INK;if(lw>0)c.strokeText(s,0,0);c.fillStyle=fill;c.fillText(s,0,0);
  c.restore();
}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);}

/* ---------- sons : à brancher plus tard (fichiers fournis par Johnny PMU) ----------
   Chaque fonction est appelée au bon moment du jeu. Il suffira d'y jouer le fichier son
   correspondant (pets, onomatopées, musique d'ambiance...). */
/* ---------- audio : prouts synthétisés + musique de fond ---------- */
let AC=null,SFX=null;
function bruitBlanc(sec){const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
let NOISE=null;
/* un prout : son grave « ronflant » qui vibre, + un peu de souffle */
function prout(force){
  if(!AC||!SFX)return;
  try{
    const t0=AC.currentTime,dur=force?rnd(0.18,0.42):rnd(0.1,0.16);
    const base=force?rnd(70,135):rnd(150,210);
    // corps du prout : dent de scie grave dont la hauteur « tremble » (lèvres qui claquent)
    const o=AC.createOscillator();o.type='sawtooth';
    o.frequency.setValueAtTime(base*rnd(1.05,1.3),t0);o.frequency.exponentialRampToValueAtTime(base*rnd(0.6,0.85),t0+dur);
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.type='square';lfo.frequency.value=rnd(18,38);lg.gain.value=base*rnd(0.25,0.5);
    lfo.connect(lg).connect(o.frequency);
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=force?rnd(500,900):1400;lp.Q.value=4;
    const g=AC.createGain();const v=force?0.55:0.18;
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.015);
    g.gain.setValueAtTime(v*0.8,t0+dur*0.6);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(lp).connect(g).connect(SFX);
    // souffle
    const s=AC.createBufferSource();s.buffer=NOISE;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=force?rnd(300,600):2200;bp.Q.value=0.8;
    const sg=AC.createGain();sg.gain.setValueAtTime(force?0.22:0.3,t0);sg.gain.exponentialRampToValueAtTime(0.0001,t0+dur*1.1);
    s.connect(bp).connect(sg).connect(SFX);
    o.start(t0);lfo.start(t0);s.start(t0,Math.random()*0.5);
    o.stop(t0+dur+0.05);lfo.stop(t0+dur+0.05);s.stop(t0+dur*1.1+0.05);
  }catch(e){}
}
const MUSIC=new Audio('musique.mp3');MUSIC.loop=true;MUSIC.preload='none';
const MUSIC_VOL=0.35;
let musicOn=true,musicStarted=false,musicLinked=false;
try{musicOn=localStorage.getItem('fayotAirlines.musique')!=='off';}catch(e){}
function linkMusic(){
  if(musicLinked||!AC)return;
  try{const s=AC.createMediaElementSource(MUSIC),g=AC.createGain();g.gain.value=MUSIC_VOL;s.connect(g).connect(AC.destination);musicLinked=true;}
  catch(e){MUSIC.volume=MUSIC_VOL;}
}
function startMusic(){
  if(!musicOn)return;
  linkMusic();if(!musicLinked)MUSIC.volume=MUSIC_VOL;
  MUSIC.play().then(()=>{musicStarted=true;}).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)MUSIC.pause();else if(musicOn&&musicStarted)MUSIC.play().catch(()=>{});
});
/* ---------- chargement des samples ---------- */
function chargerSon(url){
  return fetch(url).then(r=>r.arrayBuffer())
    .then(b=>new Promise((ok,ko)=>{const p=AC.decodeAudioData(b,ok,ko);if(p&&p.catch)p.catch(ko);}));
}
/* ---------- prouts du bouton : 4 prouts découpés dans prouts.mp3, joués au hasard ----------
   [début (s), durée (s), gain pour égaliser les volumes] */
const PROUT_SEG=[[2.53,0.57,1],[4.03,0.24,4],[5.28,0.42,2.2],[6.78,0.32,1.4]];
const PROUT_VOL=2;
let PROUTS_BUF=null,dernierProut=-1;
function proutSample(){
  if(!AC||!PROUTS_BUF)return false;
  try{
    let i=Math.floor(Math.random()*PROUT_SEG.length);
    if(PROUT_SEG.length>1&&i===dernierProut)i=(i+1+Math.floor(Math.random()*(PROUT_SEG.length-1)))%PROUT_SEG.length;
    dernierProut=i;
    const [deb,dur,gain]=PROUT_SEG[i],t0=AC.currentTime;
    const s=AC.createBufferSource();s.buffer=PROUTS_BUF;s.playbackRate.value=rnd(0.92,1.08);   // petite variation de hauteur
    const g=AC.createGain();const v=PROUT_VOL*gain;
    g.gain.setValueAtTime(v,t0);g.gain.setValueAtTime(v,t0+dur*0.75);g.gain.linearRampToValueAtTime(0.0001,t0+dur);
    s.connect(g).connect(SFX);s.start(t0,deb,dur+0.02);
    return true;
  }catch(e){return false;}
}
/* ---------- voix de Johnny ----------
   voix-prout.mp3 : 3 répliques, jouées de temps en temps à la place d'un prout
   voix-superprout.mp3 : 1 réplique, jouée au début du turbo Tabasco */
const VOIX_SEG=[[0.43,1.47],[3.73,1.59],[7.44,1.61]];
const VOIX_SUPER=[0.55,2.65];
const VOIX_CHANCE=0.14,VOIX_PAUSE=6;          // ~1 appui sur 7, au moins 6 s entre deux voix
let VOIX_BUF=null,SUPER_BUF=null,derniereVoix=-1,voixT=-99;
function jouerExtrait(buf,deb,dur,vol){
  const t0=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain();s.buffer=buf;
  g.gain.setValueAtTime(vol,t0);g.gain.setValueAtTime(vol,t0+dur-0.08);g.gain.linearRampToValueAtTime(0.0001,t0+dur);
  s.connect(g).connect(SFX);s.start(t0,deb,dur+0.02);
}
function voixPeutEtre(){
  if(!AC||!VOIX_BUF||t-voixT<VOIX_PAUSE||Math.random()>VOIX_CHANCE)return false;
  try{
    let i=Math.floor(Math.random()*VOIX_SEG.length);if(i===derniereVoix)i=(i+1)%VOIX_SEG.length;derniereVoix=i;
    jouerExtrait(VOIX_BUF,VOIX_SEG[i][0],VOIX_SEG[i][1],0.85);voixT=t;return true;
  }catch(e){return false;}
}
function voixSuper(){
  if(!AC||!SUPER_BUF)return;
  try{jouerExtrait(SUPER_BUF,VOIX_SUPER[0],VOIX_SUPER[1],0.9);voixT=t;}catch(e){}
}
/* ---------- son du turbo Tabasco (sample turbo.mp3, joué pendant tout le boost) ---------- */
let TURBO_BUF=null,turboSrc=null,turboGain=null;
function chargerTurbo(){
  if(!AC)return;
  if(!TURBO_BUF)chargerSon('turbo.mp3').then(buf=>{TURBO_BUF=buf;if(G.boost>0)turboStart();}).catch(()=>{});
  if(!PROUTS_BUF)chargerSon('prouts.mp3').then(buf=>{PROUTS_BUF=buf;}).catch(()=>{});
  if(!VOIX_BUF)chargerSon('voix-prout.mp3').then(buf=>{VOIX_BUF=buf;}).catch(()=>{});
  if(!SUPER_BUF)chargerSon('voix-superprout.mp3').then(buf=>{SUPER_BUF=buf;}).catch(()=>{});
}
function turboStart(){
  if(!AC||!TURBO_BUF||turboSrc)return;              // déjà en cours : on ne redémarre pas
  try{
    turboSrc=AC.createBufferSource();turboSrc.buffer=TURBO_BUF;turboSrc.loop=true;
    turboGain=AC.createGain();turboGain.gain.value=1;
    turboSrc.connect(turboGain).connect(SFX);turboSrc.start();
  }catch(e){turboSrc=null;}
}
function turboStop(){
  if(!turboSrc)return;
  try{const t0=AC.currentTime;turboGain.gain.setValueAtTime(turboGain.gain.value,t0);turboGain.gain.linearRampToValueAtTime(0.0001,t0+0.3);turboSrc.stop(t0+0.35);}catch(e){}
  turboSrc=null;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)turboStop();});
function initAudio(){
  if(!AC){
    try{AC=new(window.AudioContext||window.webkitAudioContext)();SFX=AC.createGain();SFX.gain.value=0.9;SFX.connect(AC.destination);NOISE=bruitBlanc(1);}
    catch(e){AC=null;}
    chargerTurbo();
  }
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
  if(!musicStarted)startMusic();
}
/* bouton rond « musique » en haut à droite (ne déclenche pas de prout) */
(function(){
  const b=document.createElement('button');b.id='btnMusique';b.type='button';
  const st=document.createElement('style');
  st.textContent='#btnMusique{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:50;width:46px;height:46px;border-radius:50%;'+
    'border:2px solid #1b0f0c;background:#f5f1e6;box-shadow:0 3px 0 #1b0f0c,0 4px 12px rgba(0,0,0,.5);display:grid;place-items:center;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}'+
    '#btnMusique svg{width:26px;height:26px}#btnMusique:active{transform:translateY(2px);box-shadow:0 1px 0 #1b0f0c}';
  document.head.appendChild(st);
  const draw=()=>{b.setAttribute('aria-label',musicOn?'Couper la musique':'Remettre la musique');
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#1b0f0c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="#d62828"/><circle cx="17" cy="16" r="3" fill="#d62828"/>'+
      (musicOn?'':'<path d="M3 3l18 18" stroke="#d62828" stroke-width="3"/>')+'</svg>';};
  draw();
  ['pointerdown','mousedown','touchstart','keydown'].forEach(t=>b.addEventListener(t,e=>e.stopPropagation()));
  b.addEventListener('click',e=>{e.stopPropagation();
    musicOn=!musicOn;try{localStorage.setItem('fayotAirlines.musique',musicOn?'on':'off');}catch(err){}
    if(musicOn){initAudio();startMusic();}else MUSIC.pause();
    draw();});
  document.body.appendChild(b);
})();

const SON={
  pet(){if(G.boost>0)return;if(voixPeutEtre())return;if(!proutSample())prout(true);},   // chaque battement / pet (silence pendant le turbo : c'est turbo.mp3 qui joue)
  petVide(){prout(false);},  // pet raté (plus de gaz) : petit « pfft »
  miam(){},       // fayots ramassés
  merguez(){},    // merguez ramassée
  tabasco(){turboStart();voixSuper();},    // début du turbo Tabasco : sample turbo.mp3 jusqu'à la fin du boost
  feu(){},        // obstacle cramé pendant le turbo
  aie(){},        // Johnny se cogne
  crash(){},      // fin de partie
  zone(){},       // nouvelle zone
  hips(){},       // hoquet
  depart(){}      // début de partie
};

/* ---------- constantes / état ---------- */
const TOP=303,GROUND=900,JX=150,JS=0.32,GRAV=1550,FLAP=-490,FLAP_VIDE=-260,ZLEN=450,GAS_COST=4,GAS_FAYOT=35;
const ZONES=['LE VILLAGE','ROUTE 66','LE CIEL DU RICARD',"L'ESPACE !"];
const ZCOL=['#35d65a','#ff8a1f','#ffd23f','#a14dff'];
const G={state:'title',st:0,cam:0,jy:620,vy:0,ang:0,spin:0,lives:3,gas:100,bonus:0,score:0,best:0,fayots:0,
  boost:0,inv:0,shake:0,bump:0,zi:0,nextX:0,prevGy:600,tabT:20,combo:1,streak:0,newBest:false,lowWarn:false,smashed:0};
const J={mood:'neutral',moodT:0,talk:0,line:'',lineAge:0,hic:7,jump:0};
let obst=[],picks=[],birds=[],parts=[],B=null;
try{G.best=parseInt(localStorage.getItem('fayotAirlines.best')||'0',10)||0;}catch(e){}

const LINES={
  start:["ACCROCHE-TOI BRO, J'AI MANGÉ TROIS BOÎTES !","HOUSTON... ON A UN PET !","PLEIN DE FAYOTS, PLEIN DE GAZ, LET'S GO !"],
  fayot:["MIAM ! DU CARBURANT, BRO !","FAYOTS POWER !","ÇA GARGOUILLE DANS LE RÉSERVOIR !","ENCORE UNE BOÎTE, MAN !"],
  merguez:["UNE MERGUEZ VOLANTE ?! MIRACLE !","GOD BLESS LA MERGUEZ !"],
  low:["J'AI PLUS DE GAZ, MAN !!","VITE, DES FAYOTS !","LE RÉSERVOIR EST VIDE, COWBOY !"],
  tabasco:["OH MY GOD ÇA BRÛLE !!","HOT HOT HOT, COWBOY !","J'AI LE FEU AU DERRIÈRE !"],
  tabend:["OUF... MES FESSES FUMENT ENCORE.","PLUS JAMAIS... ENFIN, PEUT-ÊTRE."],
  hit:["AÏE MES FESSES !","QUI A MIS ÇA LÀ ?!","MON BANDANA !","OH MY GOD, MON NEZ !"],
  pigeon:["SALE PIGEON !","DÉGAGE, LE PIAF !"],
  zone0:["SALUT LE VILLAGE ! JOHNNY S'ENVOLE !"],
  zone1:["YEEHAW ! LA ROUTE 66, MAN !","L'AMÉRIQUE... ÇA SENT LE GAZ !"],
  zone2:["LE CIEL EST JAUNE... J'AI TROP BU ?","DES GLAÇONS GÉANTS ?! JE RÊVE !"],
  zone3:["UN PETIT PET POUR L'HOMME...","HOUSTON, LA LUNE C'EST DU CAMEMBERT !"],
  end:["ATTERRISSAGE EN CATASTROPHE, MAN !","PROCHAIN VOL DANS 5 MINUTES, BRO !","IL ME FAUT UNE AUTRE BOÎTE DE FAYOTS..."]
};
const PROUTS=['PROUT !','FRRT !','BRAAP !','POUET !','PFRRT !','PROUUUT !'];
const PCOL=['#b9e05a','#ffd23f','#fff','#ff9ad5','#9be7ff'];
function say(key,mood='neutral',dur=2.2){
  const s=pick(LINES[key]);J.line=s;J.lineAge=0;J.talk=Math.min(1.8,0.4+s.length*0.035);J.mood=mood;J.moodT=dur;
}

/* ---------- décors pré-dessinés (4 zones x 2 couches en parallaxe) ---------- */
const LAY=[0,1,2,3].map(()=>({far:document.createElement('canvas'),mid:document.createElement('canvas')}));
function halftone(c,alpha){
  const p=document.createElement('canvas');p.width=p.height=9;const pc=p.getContext('2d');
  pc.fillStyle='#000';pc.beginPath();pc.arc(4.5,4.5,1.5,0,7);pc.fill();
  c.save();c.globalAlpha=alpha;c.globalCompositeOperation='source-atop';c.fillStyle=c.createPattern(p,'repeat');c.fillRect(0,0,W,H);c.restore();
}
function tile(c,seed,fn){for(const dx of [-W,0,W]){c.save();c.translate(dx,0);fn(c,mulberry(seed));c.restore();}}
function hills(c,base,amp,k,ph,col){
  c.beginPath();c.moveTo(-4,H);for(let x=-4;x<=W+4;x+=6)c.lineTo(x,base+Math.sin(x/W*Math.PI*2*k+ph)*amp+Math.sin(x/W*Math.PI*2*(k+2)+ph*2)*amp*0.35);
  c.lineTo(W+4,H);c.closePath();ink(c,col,3.5);
}
function cloud(c,x,y,s,col){
  c.beginPath();[[0,0,30],[28,-14,26],[56,0,30],[-26,6,20],[80,8,20]].forEach(([dx,dy,r])=>{c.moveTo(x+dx*s+r*s,y+dy*s);c.arc(x+dx*s,y+dy*s,r*s,0,7);});
  c.fillStyle=col;c.fill();c.lineWidth=3.5;c.strokeStyle=INK;c.stroke();
  c.beginPath();[[0,0,30],[28,-14,26],[56,0,30],[-26,6,20],[80,8,20]].forEach(([dx,dy,r])=>{c.moveTo(x+dx*s+(r-3)*s,y+dy*s);c.arc(x+dx*s,y+dy*s,(r-3)*s,0,7);});
  c.fillStyle=col;c.fill();
}
/* zone 1 : le village */
function farVillage(c){
  tile(c,21,(c,r)=>{
    cloud(c,90,430,0.9,'#fff6e8');cloud(c,360,380,0.7,'#fff6e8');
    hills(c,790,26,2,0.5,'#7aa05a');
    // église
    rrPath(c,80,610,58,240,4);ink(c,'#e2d2b0',3.5);
    c.beginPath();c.moveTo(74,612);c.lineTo(109,480);c.lineTo(144,612);c.closePath();ink(c,'#5d6b7c',3.5);
    c.strokeStyle=INK;c.lineWidth=4;c.beginPath();c.moveTo(109,480);c.lineTo(109,452);c.moveTo(99,462);c.lineTo(119,462);c.stroke();
    circ(c,109,650,16);ink(c,'#fff',3);c.lineWidth=2.5;c.beginPath();c.moveTo(109,650);c.lineTo(109,640);c.moveTo(109,650);c.lineTo(117,654);c.stroke();
    rrPath(c,138,700,90,150,3);ink(c,'#e2d2b0',3.5);
    c.beginPath();c.moveTo(134,702);c.lineTo(183,664);c.lineTo(232,702);c.closePath();ink(c,'#b5452b',3.5);
    // château d'eau
    c.strokeStyle=INK;c.lineWidth=5;c.beginPath();c.moveTo(364,700);c.lineTo(350,830);c.moveTo(416,700);c.lineTo(430,830);c.moveTo(390,700);c.lineTo(390,830);c.stroke();
    c.lineWidth=2.5;c.beginPath();c.moveTo(356,760);c.lineTo(424,760);c.stroke();
    rrPath(c,330,610,120,92,30);ink(c,'#d8dde0',4);
    c.beginPath();c.moveTo(340,612);c.quadraticCurveTo(390,570,440,612);c.closePath();ink(c,'#9aa3ad',3.5);
    txt(c,'JOHNNY',390,640,24,'#d62828',{lw:0});txt(c,'♥ LE PMU',390,670,20,'#1e4fd8',{lw:0});
    hills(c,836,18,3,2.1,'#5a8a40');
    // peupliers
    [40,250,300,500].forEach((x,i)=>{c.beginPath();c.ellipse(x,800-i%2*10,14,46,0,0,7);ink(c,'#3f6e2c',3);});
  });
}
function midVillage(c){
  tile(c,33,(c,r)=>{
    let xs=0,i=0;const cols=['#ead5a8','#d9a066','#f0e2c0','#c9876a','#e0c48c','#cfb8e0'];
    while(xs<W){
      let w=100+r()*50;if(W-xs-w<90)w=W-xs;
      const hh=120+r()*110,top=GROUND-hh,col=cols[i%cols.length];
      rrPath(c,xs+3,top,w-6,hh+20,3);ink(c,col,3.5);
      c.beginPath();c.moveTo(xs-4,top+2);c.lineTo(xs+w/2,top-42-r()*14);c.lineTo(xs+w+4,top+2);c.closePath();ink(c,'#b5452b',3.5);
      c.strokeStyle='rgba(60,15,5,0.45)';c.lineWidth=2;for(let k=1;k<3;k++){c.beginPath();c.moveTo(xs+8+k*6,top-k*12);c.lineTo(xs+w-8-k*6,top-k*12);c.stroke();}
      const wy=top+26;
      for(const wx of [xs+w*0.28,xs+w*0.72]){
        if(wy+34>GROUND-50)break;

function puff(x,y,big){for(let i=0;i<(big?7:3);i++)parts.push({k:'gas',x:x+rnd(-6,6),y:y+rnd(-6,6),vx:-speed()*0.6+rnd(-70,30),vy:rnd(140,260),r:rnd(7,12)*(big?1.2:0.8),gr:rnd(28,46),life:rnd(0.55,0.85),max:0.85,c:pick(['#b9c46a','#a7b85c','#cbbd7c','#c2d17a'])});}

function debris(x,y,col){for(let i=0;i<18;i++)parts.push({k:'deb',x:x+rnd(-30,30),y:y+rnd(-40,40),vx:rnd(-300,300),vy:rnd(-500,-100),r:rnd(0,6),vr:rnd(-10,10),life:rnd(0.8,1.3),c:col,s:rnd(8,16)});}
function updateParts(dt){
  for(const p of parts){p.life-=dt;
    if(p.k==='conf'||p.k==='deb'){p.vy+=900*dt;p.vx*=0.99;p.r+=p.vr*dt;}
    else if(p.k==='gas'){p.r+=p.gr*dt;p.vx*=0.97;p.vy*=0.95;}
    else if(p.k==='fire'){p.r*=1-dt*2;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;}
  parts=parts.filter(p=>p.life>0);
}
function drawParts(c,layer){
  for(const p of parts){

      if(p.k==='gas'){c.save();c.globalAlpha=clamp(p.life/p.max*1.4,0,1);circ(c,p.x,p.y,p.r);ink(c,p.c,3);c.restore();}
      continue;}

    else if(p.k==='fire'){const k=p.life/p.max;c.save();c.globalCompositeOperation='lighter';c.fillStyle=k>0.6?'rgba(255,240,120,0.9)':k>0.3?'rgba(255,140,30,0.85)':'rgba(255,50,20,0.7)';circ(c,p.x,p.y,p.r);c.fill();c.restore();}

/* ---------- déroulement ---------- */
function speed(){return Math.min(340,185*(1+0.07*G.zi))*(G.boost>0?2.1:1);}
function diff(){return clamp(G.cam/36000,0,1);}
function newGame(){
  turboStop();

    zi:0,nextX:W+260,prevGy:600,tabT:rnd(16,22),combo:1,streak:0,newBest:false,lowWarn:false,smashed:0});
  obst=[];picks=[];birds=[];parts=[];B=null;J.line='';
  SON.depart();say('start','happy');
  if(window.JohnnyPMU)JohnnyPMU.debutPartie();
}
function spawnObst(){
  const d=diff(),gap=lerp(295,225,d),sp=lerp(380,315,d);
  const gy=clamp(G.prevGy+rnd(-210,210),TOP+gap/2+40,GROUND-gap/2-40);G.prevGy=gy;
  const wx=G.nextX;
  obst.push({wx,gy,gap,w:96,z:zoneAt(wx),seed:Math.random()*100,passed:false,dead:false});
  if(G.tabT<=0){picks.push({k:'tab',wx,y:gy});G.tabT=rnd(26,36);}
  else if(Math.random()<0.55)picks.push({k:'fay',wx,y:gy});
  const r=Math.random(),mid=wx+sp/2,my=clamp(gy+rnd(-90,90),TOP+50,GROUND-60);
  if(r<0.33)picks.push({k:'fay',wx:mid,y:my});
  else if(r<0.45)picks.push({k:'mer',wx:mid,y:my});
  if(G.cam>3500&&Math.random()<lerp(0.12,0.3,d))birds.push({wx:wx+sp*0.5+260,y0:rnd(TOP+60,GROUND-90),ph:Math.random()*6,hit:false});
  G.nextX+=sp;
}
function flap(){
  G.inv=Math.max(G.inv,0);
  const [bx,by]=buttPos();
  if(G.boost>0||G.gas>0){
    if(G.boost<=0)G.gas=Math.max(0,G.gas-GAS_COST);
    G.vy=FLAP;puff(bx,by,true);SON.pet();
    floatText(pick(PROUTS),bx-40,by+30,pick(PCOL),26,-120);
    if(G.gas<=20&&!G.lowWarn&&G.boost<=0){G.lowWarn=true;say('low','disgust',1.8);}
  }else{
    G.vy=FLAP_VIDE;puff(bx,by,false);SON.petVide();floatText('PFFT...',bx-30,by+10,'#cfcfcf',22,-120);
    if(J.line===''||J.lineAge>2.5)say('low','disgust',1.5);
  }
}
function hurt(why){
  if(G.inv>0||G.boost>0||G.state!=='fly')return;
  G.lives--;G.inv=1.6;G.shake=16;G.combo=1;G.streak=0;SON.aie();
  burst('AÏE !','#ff3b3b','',1.1);say(why==='pigeon'?'pigeon':'hit','angry');
  if(G.lives<=0){G.state='crash';G.st=0;G.vy=-420;SON.crash();}
}
function endGame(){
  turboStop();
  G.state='over';G.st=0;
  if(G.score>G.best){G.best=G.score;G.newBest=true;try{localStorage.setItem('fayotAirlines.best',String(G.best));}catch(e){}}
  say('end','angry',3);
  if(window.JohnnyPMU)JohnnyPMU.finDePartie();
  // Top 10 : on bloque « Ressers-moi des fayots » tant que la fenêtre n'a pas été fermée

}

function update(dt){
  t+=dt;G.st+=dt;
  J.talk-=dt;J.lineAge+=dt;J.moodT-=dt;if(J.moodT<=0)J.mood=G.boost>0?'angry':'neutral';if(J.lineAge>3.4&&G.state!=='over')J.line='';
  J.jump=Math.max(0,J.jump-dt*4);
  G.shake=Math.max(0,G.shake-dt*30);G.bump=Math.max(0,G.bump-dt*3);G.inv=Math.max(0,G.inv-dt);
  if(B)B.t+=dt;

  if(G.state==='title'){G.cam+=50*dt;G.jy=620;}
  if(G.state==='ready'){G.jy=620+Math.sin(t*3)*10;G.ang=Math.sin(t*2)*0.05;if(Math.random()<0.08){const [bx,by]=buttPos();puff(bx,by,false);}}
  if(G.state==='fly'||G.state==='crash'){
    const sp=G.state==='crash'?speed()*Math.max(0,1-G.st):speed();
    G.cam+=sp*dt;
    G.vy=Math.min(820,G.vy+GRAV*dt);G.jy+=G.vy*dt;
    if(G.jy<TOP+46){G.jy=TOP+46;G.vy=Math.max(G.vy,0);}
    if(G.state==='fly'){
      G.ang=clamp(G.vy/1800,-0.15,0.22);
      // zone
      const zi=Math.floor(G.cam/10/ZLEN);
      if(zi>G.zi){G.zi=zi;burst(ZONES[zi%4],ZCOL[zi%4],'ZONE '+(zi+1),2);say('zone'+(zi%4),'happy');SON.zone();confetti(50);}
      // hoquet
      J.hic-=dt;if(J.hic<=0){J.hic=rnd(6,12);J.jump=1;G.vy-=140;floatText('HIPS !',JX+30,G.jy-90,'#fff',28);SON.hips();}
      // turbo
      G.tabT-=dt;
      if(G.boost>0){G.boost-=dt;const [bx,by]=buttPos();fire(bx,by);if(G.boost<=0){G.boost=0;G.inv=1.2;turboStop();say('tabend','disgust');}}
      // sol
      if(G.jy>GROUND-46){G.jy=GROUND-46;G.vy=-560;hurt('sol');}
      while(G.nextX<G.cam+W+140)spawnObst();
      const hc=hitCircles();
      for(const o of obst){if(o.dead)continue;const sx=o.wx-G.cam;
        if(sx>-80&&sx<JX+120){
          const R=obRects(o,sx);
          if(hc.some(([cx,cy,r])=>R.some(rr=>{const nx=clamp(cx,rr[0],rr[2]),ny=clamp(cy,rr[1],rr[3]);return(cx-nx)**2+(cy-ny)**2<r*r;}))){
            if(G.boost>0){o.dead=true;G.smashed++;debris(sx,o.gy-o.gap/2-40,ZCOL[o.z]);debris(sx,o.gy+o.gap/2+40,ZCOL[o.z]);G.shake=10;addBonus(50,sx,o.gy,'#ff8a1f');floatText('FWOOOSH !',sx,o.gy-60,'#ff4b2b',34);SON.feu();}
            else hurt('obst');
          }
        }
        if(!o.passed&&sx<JX-60){o.passed=true;if(G.state==='fly'){G.streak++;G.combo=Math.min(5,1+Math.floor(G.streak/5));addBonus(10*G.combo);}}
      }
      for(const p of picks){if(p.got)continue;const sx=p.wx-G.cam,py=p.y+Math.sin(t*3+p.wx)*6;
        if(hc.some(([cx,cy,r])=>(cx-sx)**2+(cy-py)**2<(r+20)**2)){
          p.got=true;
          if(p.k==='fay'){G.gas=Math.min(100,G.gas+GAS_FAYOT);G.fayots++;G.lowWarn=false;addBonus(20);floatText('+GAZ',sx,py-20,'#35d65a',30);SON.miam();if(Math.random()<0.3)say('fayot','happy');confetti(12,sx,py);}
          else if(p.k==='mer'){addBonus(100,sx,py,'#ff8a1f');SON.merguez();say('merguez','happy');confetti(20,sx,py);}
          else{G.boost=5;G.gas=100;burst('TABASCO TURBO !','#ff3b3b','HOT HOT HOT !',1.8);say('tabasco','angry',5);SON.tabasco();G.shake=12;confetti(60,sx,py);}
        }}
      for(const b of birds){if(b.hit)continue;b.wx-=110*dt;const sx=b.wx-G.cam,by=b.y0+Math.sin(t*2.5+b.ph)*40;
        if(sx<JX+80&&sx>JX-80&&hc.some(([cx,cy,r])=>(cx-sx)**2+(cy-by)**2<(r+16)**2)){
          if(G.boost>0){b.hit=true;debris(sx,by,'#a2abb5');addBonus(30,sx,by,'#ff8a1f');floatText('PIGEON GRILLÉ !',sx,by-40,'#ff4b2b',26);}
          else if(G.inv<=0){b.hit=true;hurt('pigeon');}
        }}
    }else{
      G.spin+=dt*9;G.ang=G.spin;
      if(G.jy>GROUND-46){G.jy=GROUND-46;G.vy=-G.vy*0.35;if(Math.abs(G.vy)<80)G.vy=0;G.shake=Math.max(G.shake,8);}
      if(G.st>1.6)endGame();
    }
    G.score=Math.floor(G.cam/10)+G.bonus;
    obst=obst.filter(o=>o.wx-G.cam>-140);picks=picks.filter(p=>!p.got&&p.wx-G.cam>-60);birds=birds.filter(b=>!b.hit&&b.wx-G.cam>-80);
  }
  updateParts(dt);
}
function zoneBlend(){
  const m=Math.max(0,G.cam/10)||0,zi=Math.floor(m/ZLEN),f=m-zi*ZLEN;
  return{z:zi%4,n:(zi+1)%4,k:clamp((f-(ZLEN-50))/50,0,1)};
}
function draw(){
  const c=ctx;c.setTransform(S*DPR,0,0,S*DPR,0,-CAM*S*DPR);
  c.fillStyle='#140a06';c.fillRect(0,0,W,H);
  c.save();c.beginPath();c.rect(0,240,W,H-240);c.clip();
  if(G.shake>0)c.translate(rnd(-1,1)*G.shake,rnd(-1,1)*G.shake);
  const zb=zoneBlend();
  const back=(z,a)=>{if(a<=0)return;c.save();c.globalAlpha=a;drawSky(c,z);drawLayer(c,LAY[z].far,G.cam*0.12);drawLayer(c,LAY[z].mid,G.cam*0.4);c.restore();};
  back(zb.z,1);back(zb.n,zb.k);
  if(G.state!=='title')drawPMUFront(c,40-G.cam);
  for(const o of obst){if(!o.dead)drawObst(c,o,o.wx-G.cam);}
  c.save();drawGround(c,zb.z,G.cam);c.restore();
  if(zb.k>0){c.save();c.globalAlpha=zb.k;drawGround(c,zb.n,G.cam);c.restore();}
  for(const p of picks){const sx=p.wx-G.cam;if(sx<-60||sx>W+60)continue;const py=p.y+Math.sin(t*3+p.wx)*6;
    if(p.k==='fay')drawFayot(c,sx,py);else if(p.k==='mer')drawMerguez(c,sx,py);else drawTabasco(c,sx,py);}
  for(const b of birds){const sx=b.wx-G.cam;if(sx<-60||sx>W+60)continue;drawPigeon(c,sx,b.y0+Math.sin(t*2.5+b.ph)*40,zoneAt(b.wx)===3);}
  drawParts(c,'back');
  if(G.state!=='title'&&G.state!=='over'){
    if(!(G.inv>0&&Math.sin(t*30)>0.2))drawFlyer(c,JX,G.jy,G.ang,JS);
  }
  drawSpeedLines(c);
  drawParts(c,'front');
  drawLight(c);
  if(G.state==='ready'&&Math.sin(t*6)>-0.4)txt(c,'TAPE POUR DÉCOLLER !',270,800,40,'#ffd23f',{rot:-0.04,lw:8,shadow:'#1e4fd8'});
  if(G.state!=='title'&&G.state!=='over'){drawBubble(c);drawBurst(c);drawHUD(c);}
  c.restore();
  if(G.state==='title')drawTitle(c);
  if(G.state==='over')drawOver(c);
}
let last=performance.now();
function loop(now){const dt=clamp((now-last)/1000,0,0.05);last=now;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);})();
</script>
