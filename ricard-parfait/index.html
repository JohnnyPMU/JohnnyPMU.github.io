<div id="wrap"><canvas id="c"></canvas></div>
<script>
(()=>{
const W=540,H=960,TOP=240,VH=H-TOP,INK='#1b0f0c',SKIN='#f2b080',FONT='Bangers, Impact, sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S=1,DPR=1,t=0;
const bgBack=document.createElement('canvas'),bgFront=document.createElement('canvas');

/* ---------- utils ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let r=Math.imul(a^a>>>15,1|a);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296;}}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const easeOutBack=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);};
function rrPath(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function ink(c,fill,lw=4){if(fill){c.fillStyle=fill;c.fill();}c.lineWidth=lw;c.strokeStyle=INK;c.lineJoin='round';c.lineCap='round';c.stroke();}
function txt(c,s,x,y,size,fill,o={}){
  c.save();c.translate(x,y);if(o.rot)c.rotate(o.rot);
  c.font=size+'px '+FONT;c.textAlign=o.align||'center';c.textBaseline='middle';c.lineJoin='round';
  if(o.max){const w=c.measureText(s).width;if(w>o.max){const k=o.max/w;c.scale(k,k);}}
  const lw=o.lw!=null?o.lw:size*0.18;
  if(o.shadow){c.lineWidth=lw;c.strokeStyle=o.shadow;c.strokeText(s,5,6);c.fillStyle=o.shadow;c.fillText(s,5,6);}
  c.lineWidth=lw;c.strokeStyle=o.stroke||INK;if(lw>0)c.strokeText(s,0,0);c.fillStyle=fill;c.fillText(s,0,0);
  c.restore();
}
const rgba=(a,al)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
const mixc=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];

/* ---------- audio ---------- */
let AC=null,pourGain=null,pourFilter=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    pourFilter=AC.createBiquadFilter();pourFilter.type='bandpass';pourFilter.frequency.value=900;pourFilter.Q.value=1.2;
    pourGain=AC.createGain();pourGain.gain.value=0;
    src.connect(pourFilter).connect(pourGain).connect(AC.destination);src.start();
  }catch(e){AC=null;}
}
/* ---------- musique de fond (démarre au 1er appui, en boucle) ---------- */
const MUSIC=new Audio('musique.mp3');MUSIC.loop=true;MUSIC.preload='none';
const MUSIC_VOL=0.35;
let musicOn=true,musicStarted=false,musicLinked=false;
try{musicOn=localStorage.getItem('ricardParfait.musique')!=='off';}catch(e){}
function linkMusic(){
  if(musicLinked||!AC)return;
  try{const s=AC.createMediaElementSource(MUSIC),g=AC.createGain();g.gain.value=MUSIC_VOL;s.connect(g).connect(AC.destination);musicLinked=true;}
  catch(e){MUSIC.volume=MUSIC_VOL;}
}
function startMusic(){
  if(!musicOn)return;
  linkMusic();if(!musicLinked)MUSIC.volume=MUSIC_VOL;
  MUSIC.play().then(()=>{musicStarted=true;}).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)MUSIC.pause();else if(musicOn&&musicStarted)MUSIC.play().catch(()=>{});
});
(function(){
  const b=document.createElement('button');b.id='btnMusique';b.type='button';
  const st=document.createElement('style');
  st.textContent='#btnMusique{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:50;width:46px;height:46px;border-radius:50%;'+
    'border:2px solid #1b0f0c;background:#f5f1e6;box-shadow:0 3px 0 #1b0f0c,0 4px 12px rgba(0,0,0,.5);display:grid;place-items:center;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}'+
    '#btnMusique svg{width:26px;height:26px}#btnMusique:active{transform:translateY(2px);box-shadow:0 1px 0 #1b0f0c}';
  document.head.appendChild(st);
  const draw=()=>{b.setAttribute('aria-label',musicOn?'Couper la musique':'Remettre la musique');
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#1b0f0c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="#d62828"/><circle cx="17" cy="16" r="3" fill="#d62828"/>'+
      (musicOn?'':'<path d="M3 3l18 18" stroke="#d62828" stroke-width="3"/>')+'</svg>';};
  draw();
  ['pointerdown','mousedown','touchstart'].forEach(t=>b.addEventListener(t,e=>e.stopPropagation()));
  b.addEventListener('click',e=>{e.stopPropagation();
    musicOn=!musicOn;try{localStorage.setItem('ricardParfait.musique',musicOn?'on':'off');}catch(err){}
    if(musicOn){initAudio();if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});startMusic();}else MUSIC.pause();
    draw();});
  document.body.appendChild(b);
})();
function beep(f,dur,type='square',vol=0.1,slide=0,delay=0){
  if(!AC)return;
  try{const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+dur+0.05);}catch(e){}
}
const SFX={
  pile(){[523,659,784,1046,1318].forEach((f,i)=>beep(f,0.18,'square',0.08,0,i*0.07));},
  perfect(){[523,659,784,1046].forEach((f,i)=>beep(f,0.16,'square',0.08,0,i*0.08));},
  good(){[440,554].forEach((f,i)=>beep(f,0.15,'triangle',0.12,0,i*0.1));},
  fail(){beep(260,0.55,'sawtooth',0.1,0.35);beep(180,0.6,'square',0.05,0.4,0.05);},
  over(){beep(120,0.7,'sawtooth',0.12,0.4);beep(900,0.25,'triangle',0.06,0.3);},
  hips(){beep(520,0.12,'sine',0.14,1.8);},
  pop(){beep(700,0.07,'triangle',0.08,1.4);},
  start(){[392,523,659].forEach((f,i)=>beep(f,0.12,'square',0.07,0,i*0.06));}
};

/* ---------- state ---------- */
const GX=200,YB=822,YT=578,IH=YB-YT,HWB=50,HWT=66;
const PX=128,PY=482;
const hw=y=>HWB+(HWT-HWB)*(YB-y)/IH;
const G={state:'title',score:0,best:0,lives:3,combo:1,round:0,level:0,flow:0,holding:false,off:0,st:0,
  puddle:0,shake:0,bump:0,overflowed:false,served:0,newBest:false,idleT:0};
const R={dose:0.12,T:0.72,h:0.06,rate:0.3,wA:0,wW:3,warned:false,double:false};
const J={mood:'neutral',moodT:0,talk:0,line:'',lineAge:0,hic:6,jump:0};
let parts=[],B=null,neonOn=true,neonT=1,bOn=true,bT=0.2;
try{G.best=parseInt(localStorage.getItem('ricardParfait.best')||'0',10)||0;}catch(e){}

const LINES={
  idle:["ALLEZ, SERS-MOI UN JAUNE, MAN !","J'AI SOIF COMME UN COWBOY DANS LE DÉSERT !","UN PETIT JAUNE ET JE RENTRE... PROMIS !","AMÉRICA... ET PASTIS !"],
  wait:["BON, TU VERSES OU TU PRIES ?","J'AI LE GOSIER SEC, BRO !","HEY ! LA CARAFE, ELLE VA PAS SE VERSER TOUTE SEULE !"],
  pile:["PILE POIL ! T'ES LE BARMAN DE L'ANNÉE, BRO !","OH MY GOD... C'EST BEAU COMME LE TEXAS !","GOD BLESS LA FRANCE ET TON POIGNET !"],
  perfect:["ÇA C'EST UN VRAI JAUNE, MON POTE !","YEEHAW ! PARFAIT !","MÊME LE PATRON LE SERT PAS COMME ÇA !"],
  good:["PAS MAL, COWBOY.","ÇA PASSE... J'AI VU PIRE À DALLAS.","BOF... MAIS JE BOIS QUAND MÊME."],
  little:["C'EST DU SIROP, LÀ ! T'ES RADIN SUR L'EAU ?","ÇA ARRACHE LA GORGE, MAN !","JE VAIS CRACHER DU FEU COMME UN DRAGON !"],
  much:["C'EST DE LA FLOTTE ÇA, MON POTE !","TU VEUX ME NOYER OU QUOI ?!","ON EST PAS À LA PISCINE MUNICIPALE !"],
  over:["MON ZINC !! LE PATRON VA TE TUER !","OH MY GOD ! ÇA DÉBORDE DE PARTOUT !","T'AS CRU QUE C'ÉTAIT LES CHUTES DU NIAGARA ?!"],
  stop:["WOOOH ! STOP ! STOP !","DOUCEMENT, COWBOY !"],
  double:["ATTENDS... Y'A DEUX VERRES OU C'EST MOI ?"],
  shake:["MA MAIN TREMBLE, C'EST LA TIENNE AUSSI ?"],
  end:["C'EST LA FERMETURE, MON POTE ! ON REMET ÇA ?","LE PATRON NOUS JETTE DEHORS, MAN !"]
};
function say(key,mood='neutral',dur=2.2){
  const s=pick(LINES[key]);J.line=s;J.lineAge=0;J.talk=Math.min(1.8,0.4+s.length*0.035);J.mood=mood;J.moodT=dur;
}

/* ---------- background (pre-rendered) ---------- */
function halftone(c,alpha){
  const p=document.createElement('canvas');p.width=p.height=9;const pc=p.getContext('2d');
  pc.fillStyle='#000';pc.beginPath();pc.arc(4.5,4.5,1.5,0,7);pc.fill();
  c.save();c.globalAlpha=alpha;c.fillStyle=c.createPattern(p,'repeat');c.fillRect(0,0,W,H);c.restore();
}
function drawBack(c){
  const r=mulberry(11);
  let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a8803c');g.addColorStop(0.45,'#cfa85e');g.addColorStop(1,'#7a5426');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  for(let x=0;x<W;x+=36){c.fillStyle='rgba(110,60,15,0.14)';c.fillRect(x,0,15,H);
    for(let y=18;y<H;y+=46){c.fillStyle='rgba(255,240,200,0.14)';c.beginPath();c.moveTo(x+26,y);c.lineTo(x+31,y+7);c.lineTo(x+26,y+14);c.lineTo(x+21,y+7);c.fill();}}
  for(let i=0;i<10;i++){const x=r()*W,y=320+r()*480,rad=40+r()*100;const rg=c.createRadialGradient(x,y,rad*0.1,x,y,rad);
    rg.addColorStop(0,'rgba(80,45,10,0.28)');rg.addColorStop(0.75,'rgba(80,45,10,0.14)');rg.addColorStop(1,'rgba(80,45,10,0)');c.fillStyle=rg;c.beginPath();c.arc(x,y,rad,0,7);c.fill();}
  g=c.createLinearGradient(0,240,0,480);g.addColorStop(0,'rgba(60,32,8,0.6)');g.addColorStop(1,'rgba(60,32,8,0)');c.fillStyle=g;c.fillRect(0,240,W,240);
  // peeling patches
  for(let i=0;i<7;i++){
    const x=r()*(W-60),y=320+r()*440,w=40+r()*70,h=30+r()*60;
    c.beginPath();c.moveTo(x,y);
    for(let k=0;k<=6;k++)c.lineTo(x+w*k/6,y+(r()-0.5)*10);
    for(let k=6;k>=0;k--)c.lineTo(x+w*k/6+(r()-0.5)*8,y+h+(r()-0.5)*12);
    c.closePath();ink(c,'#b9ab92',2.5);
    c.beginPath();c.moveTo(x+w,y);c.lineTo(x+w-18,y);c.lineTo(x+w-4,y+20);c.closePath();ink(c,'#ead9a8',2.5);
  }
  // cracks
  for(let i=0;i<6;i++){let x=r()*W,y=320+r()*430;c.beginPath();c.moveTo(x,y);
    for(let k=0;k<8;k++){x+=(r()-0.5)*32;y+=8+r()*18;c.lineTo(x,y);}c.strokeStyle='rgba(30,15,5,0.75)';c.lineWidth=2.2;c.stroke();}
  // ceiling molding
  c.fillStyle='#5a3a1a';c.fillRect(0,300,W,10);c.fillStyle='rgba(0,0,0,0.25)';c.fillRect(0,310,W,6);
  // TV bracket
  rrPath(c,2,634,132,12,4);ink(c,'#6b3a17',3.5);
  // shelf + bottles
  const cols=['#2f8f3a','#c0392b','#e0a800','#3a5fcd','#7b3fa0','#d35400','#16a085','#8e1c1c'];
  const labs=['PASTIS','RHUM','GIN','ANIS','KIR','WHISKY','PICON','SUZE'];
  for(let i=0;i<7;i++){
    const bx=16+i*38,bh=58+r()*30,col=cols[i%cols.length];
    if(i===5){ // fallen bottle
      c.save();c.translate(bx+30,458);c.rotate(-Math.PI/2+0.05);
      rrPath(c,-12,-34,24,64,8);ink(c,col,3.5);rrPath(c,-5,-50,10,18,3);ink(c,col,3);
      c.fillStyle='#f3ead2';c.fillRect(-9,-14,18,22);c.restore();continue;}
    c.beginPath();c.moveTo(bx,468);c.lineTo(bx,468-bh+20);c.quadraticCurveTo(bx,468-bh+6,bx+8,468-bh+2);c.lineTo(bx+8,468-bh-16);c.lineTo(bx+18,468-bh-16);c.lineTo(bx+18,468-bh+2);c.quadraticCurveTo(bx+26,468-bh+6,bx+26,468-bh+20);c.lineTo(bx+26,468);c.closePath();
    ink(c,col,3.5);
    c.fillStyle='#f3ead2';c.fillRect(bx+3,468-bh*0.55,20,bh*0.3);c.strokeStyle=INK;c.lineWidth=1.5;c.strokeRect(bx+3,468-bh*0.55,20,bh*0.3);
    c.save();c.translate(bx+13,468-bh*0.4);c.rotate(-Math.PI/2);c.font='9px '+FONT;c.fillStyle='#8b1b12';c.textAlign='center';c.textBaseline='middle';c.fillText(labs[i],0,0);c.restore();
    c.fillStyle='rgba(255,255,255,0.45)';c.fillRect(bx+4,468-bh+18,3,bh*0.35);
  }
  rrPath(c,-10,468,318,14,4);ink(c,'#6b3a17',4);
  c.fillStyle='rgba(0,0,0,0.25)';c.fillRect(0,482,305,8);
  // darts stuck in the wall (missed...)
  [[70,528,-0.5],[118,700,0.35]].forEach(([x,y,a])=>{c.save();c.translate(x,y);c.rotate(a);c.beginPath();c.moveTo(0,0);c.lineTo(-24,0);c.strokeStyle=INK;c.lineWidth=3;c.stroke();
    c.beginPath();c.moveTo(-24,0);c.lineTo(-34,-8);c.lineTo(-34,8);c.closePath();ink(c,'#ff3df0',2);c.restore();});
  halftone(c,0.09);
}
function drawFront(c){
  let g=c.createLinearGradient(0,826,0,858);g.addColorStop(0,'#f2f6f8');g.addColorStop(0.45,'#a7b2ba');g.addColorStop(1,'#5b646b');
  c.fillStyle=g;c.fillRect(0,826,W,32);
  c.fillStyle=INK;c.fillRect(0,822,W,5);c.fillRect(0,856,W,4);
  const r=mulberry(5);
  for(let i=0;i<14;i++){const x=r()*W,y=830+r()*22;c.strokeStyle=r()<0.5?'rgba(255,255,255,0.7)':'rgba(40,40,40,0.4)';c.lineWidth=1.5;c.beginPath();c.moveTo(x,y);c.lineTo(x+10+r()*25,y+(r()-0.5)*4);c.stroke();}
  g=c.createLinearGradient(0,860,0,H);g.addColorStop(0,'#7a3f1c');g.addColorStop(1,'#3e1d0b');c.fillStyle=g;c.fillRect(0,860,W,100);
  for(let x=0;x<W;x+=90){rrPath(c,x+10,872,70,52,6);c.fillStyle='rgba(255,180,110,0.12)';c.fill();c.strokeStyle='rgba(20,8,2,0.7)';c.lineWidth=3;c.stroke();}
  for(let i=0;i<10;i++){const x=r()*W,y=870+r()*80;c.strokeStyle='rgba(255,220,180,0.25)';c.lineWidth=2;c.beginPath();c.moveTo(x,y);c.lineTo(x+8+r()*15,y+r()*6);c.stroke();}
  c.strokeStyle=INK;c.lineWidth=16;c.beginPath();c.moveTo(0,940);c.lineTo(W,940);c.stroke();
  c.strokeStyle='#d9a521';c.lineWidth=10;c.stroke();
  c.strokeStyle='rgba(255,255,220,0.8)';c.lineWidth=3;c.beginPath();c.moveTo(0,937);c.lineTo(W,937);c.stroke();
  halftone(c,0.08);
}
function buildBG(){
  [[bgBack,drawBack],[bgFront,drawFront]].forEach(([cn,fn])=>{cn.width=Math.round(W*S*DPR);cn.height=Math.round(H*S*DPR);const c=cn.getContext('2d');c.setTransform(S*DPR,0,0,S*DPR,0,0);fn(c);});
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  S=Math.min(innerWidth/W,innerHeight/VH);
  cv.style.width=Math.round(W*S)+'px';cv.style.height=Math.round(VH*S)+'px';
  cv.width=Math.round(W*S*DPR);cv.height=Math.round(VH*S*DPR);
  buildBG();
}
addEventListener('resize',resize);resize();
if(document.fonts&&document.fonts.load){document.fonts.load('40px Bangers').then(()=>buildBG()).catch(()=>{});}

/* ---------- dynamic decor ---------- */
function drawNeon(c){
  const x=8,y=656,w=120,h=60;
  rrPath(c,x,y,w,h,12);ink(c,'#2a1a12',4);
  c.save();if(neonOn){c.shadowColor='#39ff6a';c.shadowBlur=24;}
  rrPath(c,x+7,y+7,w-14,h-14,8);c.strokeStyle=neonOn?'#39ff6a':'#24432c';c.lineWidth=3;c.stroke();
  c.font='44px '+FONT;c.textAlign='center';c.textBaseline='middle';c.fillStyle=neonOn?'#7dffa0':'#24432c';c.fillText('PMU',x+w/2,y+h/2+3);
  c.restore();
  // BAR TABAC with a broken B
  c.save();c.font='22px '+FONT;c.textBaseline='middle';c.textAlign='left';
  const parts=['BAR TA','B','AC'];let tw=0;parts.forEach(p=>tw+=c.measureText(p).width);
  let px=x+w/2-tw/2;const py=y+h+18;
  parts.forEach((p,i)=>{const on=i===1?bOn&&neonOn:true;
    if(on){c.shadowColor='#ff3b3b';c.shadowBlur=16;c.fillStyle='#ff6b5b';}else{c.shadowBlur=0;c.fillStyle='#4a1d18';}
    c.fillText(p,px,py);px+=c.measureText(p).width;});
  c.restore();
}
function drawTV(c){
  const x=8,y=546,w=124,h=86;
  rrPath(c,x,y,w,h,12);ink(c,'#3b3b3b',4);
  const sx=x+10,sy=y+10,sw=w-46,sh=h-20;
  c.save();rrPath(c,sx,sy,sw,sh,8);c.clip();
  let g=c.createLinearGradient(0,sy,0,sy+sh);g.addColorStop(0,'#6fb7ff');g.addColorStop(0.35,'#bfe3ff');g.addColorStop(0.36,'#2f9a3e');g.addColorStop(1,'#1d6b28');
  c.fillStyle=g;c.fillRect(sx,sy,sw,sh);
  c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.moveTo(sx,sy+sh*0.42);c.lineTo(sx+sw,sy+sh*0.42);c.stroke();
  const jc=['#ff3b3b','#ffd23f','#3a5fcd','#ff3df0'],sp=[1.05,1.2,0.95,1.13];
  for(let i=0;i<4;i++){
    const hx=sx-20+((t*30*sp[i]+i*37)%(sw+40)),hy=sy+sh*0.5+i*9;
    const leg=Math.sin(t*20+i)*4;
    c.strokeStyle='#3a1d0b';c.lineWidth=2;c.beginPath();c.moveTo(hx-6,hy+3);c.lineTo(hx-6-leg,hy+10);c.moveTo(hx+6,hy+3);c.lineTo(hx+6+leg,hy+10);c.stroke();
    c.fillStyle='#6b3a17';c.beginPath();c.ellipse(hx,hy,10,5,0,0,7);c.fill();c.beginPath();c.ellipse(hx+11,hy-4,5,3,-0.5,0,7);c.fill();
    c.fillStyle=jc[i];c.beginPath();c.arc(hx-1,hy-7,3.5,0,7);c.fill();

    else if(p.k==='drop'){p.vy+=1100*dt;if(p.y>840&&p.ground){p.life=0;G.puddle+=0.002;}}
    p.x+=p.vx*dt;p.y+=p.vy*dt;}
  parts=parts.filter(p=>p.life>0);
}
function drawParts(c){
  for(const p of parts){
    if(p.k==='conf'){c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore();}
    else if(p.k==='drop'){c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.s,0,7);c.fill();}
    else if(p.k==='text'){const k=p.life/p.max;c.save();c.globalAlpha=Math.min(1,k*2);txt(c,p.txt,p.x,p.y,p.s*(1+(1-k)*0.2),p.c,{lw:7});c.restore();}
  }
}
function starPath(c,n,r1,r2){c.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=i*Math.PI/n-Math.PI/2;c.lineTo(Math.cos(a)*r*(i%4===0?1.08:1),Math.sin(a)*r);}c.closePath();}
function drawBurst(c){
  if(!B)return;const a=B.t;if(a>B.dur)return;
  const sc=a<0.28?Math.max(0,easeOutBack(a/0.28)):1+Math.sin(a*9)*0.03;
  const al=a>B.dur-0.3?(B.dur-a)/0.3:1;
  c.save();c.globalAlpha=clamp(al,0,1);c.translate(270,500);c.rotate(-0.07+Math.sin(a*3)*0.03);c.scale(sc,sc);
  c.save();c.rotate(a*0.6);starPath(c,14,180,128);ink(c,B.color,7);starPath(c,14,150,112);c.fillStyle='rgba(255,255,255,0.25)';c.fill();c.restore();
  txt(c,B.text,0,B.sub?-18:0,58,'#fff',{lw:10,max:300});
  if(B.sub)txt(c,B.sub,0,40,40,'#ffd23f',{lw:8});
  c.restore();
}
function wrap(c,s,max){const w=s.split(' '),out=[];let line='';for(const word of w){const tl=line?line+' '+word:word;if(c.measureText(tl).width>max&&line){out.push(line);line=word;}else line=tl;}if(line)out.push(line);return out;}
function drawBubble(c){
  if(!J.line)return;
  const sc=J.lineAge<0.18?Math.max(0.01,easeOutBack(J.lineAge/0.18)):1;
  c.save();c.translate(372,404);c.scale(sc,sc);c.translate(-372,-404);
  c.beginPath();c.moveTo(322,352);c.lineTo(322,384);c.lineTo(374,404);c.closePath();ink(c,'#fff',4);
  rrPath(c,12,306,320,94,20);ink(c,'#fff',4.5);
  c.beginPath();c.moveTo(326,356);c.lineTo(326,382);c.lineTo(366,399);c.closePath();c.fillStyle='#fff';c.fill();
  c.font='24px '+FONT;const lines=wrap(c,J.line,292).slice(0,3);
  const lh=26,y0=354-(lines.length-1)*lh/2;
  c.textAlign='center';c.textBaseline='middle';c.fillStyle=INK;
  lines.forEach((l,i)=>c.fillText(l,172,y0+i*lh));
  c.restore();
}
function miniGlass(c,x,y,full){
  c.beginPath();c.moveTo(x-12,y-16);c.lineTo(x+12,y-16);c.lineTo(x+9,y+16);c.lineTo(x-9,y+16);c.closePath();
  if(full){c.fillStyle='#f4dc8a';c.fill();}c.strokeStyle='#fff';c.lineWidth=3;c.stroke();
  if(!full){c.strokeStyle='#ff3b3b';c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(x-11,y-11);c.lineTo(x+11,y+11);c.moveTo(x+11,y-11);c.lineTo(x-11,y+11);c.stroke();}
}
function drawHUD(c){
  c.save();c.translate(0,240);
  c.fillStyle='rgba(25,12,6,0.88)';c.fillRect(0,0,W,56);c.fillStyle='#ffd23f';c.fillRect(0,56,W,4);c.fillStyle=INK;c.fillRect(0,60,W,3);
  txt(c,'SCORE',20,13,15,'#fff',{align:'left',lw:4});
  txt(c,String(G.score),20,37,32*(1+G.bump*0.4),'#ffd23f',{align:'left',lw:6});
  txt(c,'VERRE N°'+Math.max(1,G.round),262,30,30,'#fff',{lw:6});
  for(let i=0;i<3;i++)miniGlass(c,440+i*36,29,i<G.lives);
  if(G.combo>1){
    const p=1+Math.sin(t*8)*0.06;c.save();c.translate(470,72);c.scale(p,p);c.rotate(-0.05);
    rrPath(c,-56,-15,112,30,10);ink(c,'#ff3df0',4);txt(c,'COMBO x'+G.combo,0,1,22,'#fff',{lw:5});c.restore();
  }
  c.restore();
}
function button(c,label,y,col,active=true){
  const p=active?1+Math.sin(t*5)*0.04:1;
  c.save();c.translate(270,y);c.scale(p,p);c.rotate(-0.02);
  rrPath(c,-180,-44,360,88,24);c.fillStyle=INK;c.save();c.translate(6,8);c.fill();c.restore();
  ink(c,active?col:'#777',6);txt(c,label,0,2,40,'#fff',{lw:8,max:320});c.restore();
}
function rays(c,cx,cy){c.save();c.translate(cx,cy);c.rotate(t*0.2);for(let i=0;i<16;i++){c.fillStyle=i%2?'rgba(255,210,63,0.22)':'rgba(255,75,43,0.16)';c.beginPath();c.moveTo(0,0);c.arc(0,0,700,i*Math.PI/8,(i+1)*Math.PI/8);c.closePath();c.fill();}c.restore();}
function drawTitle(c){
  c.save();c.beginPath();c.rect(0,240,W,H-240);c.clip();
  c.fillStyle='rgba(15,6,2,0.62)';c.fillRect(0,240,W,H-240);rays(c,270,420);
  const wob=Math.sin(t*2)*0.04;
  txt(c,'LE RICARD',270,325,72,'#ffd23f',{rot:-0.08+wob,lw:11,shadow:'#1e4fd8'});
  txt(c,'PARFAIT',270,410,100,'#ff4b2b',{rot:-0.05-wob,lw:13,shadow:'#1e4fd8'});
  txt(c,'UN JEU DE JOHNNY PMU',270,478,28,'#fff',{lw:6,rot:-0.03});
  rrPath(c,50,512,440,166,20);ink(c,'rgba(255,248,230,0.95)',5);
  const L=[['MAINTIENS',' POUR VERSER L\'EAU'],['LÂCHE',' DANS LA ZONE VERTE'],['ZONE JAUNE',' = BONUS, ROSE = PILE POIL']];
  c.font='27px '+FONT;c.textBaseline='middle';
  L.forEach(([a,b],i)=>{const y=552+i*44;const wa=c.measureText(a).width,wb=c.measureText(b).width;let x=270-(wa+wb)/2;c.textAlign='left';c.fillStyle='#d62828';c.fillText(a,x,y);c.fillStyle=INK;c.fillText(b,x+wa,y);});
  button(c,'SERS-MOI UN JAUNE !',768,'#35d65a');
  if(G.best>0)txt(c,'RECORD : '+G.best,270,866,30,'#ffd23f',{lw:6});
  c.restore();
}
function drawOver(c){
  c.save();c.beginPath();c.rect(0,240,W,H-240);c.clip();
  c.fillStyle='rgba(15,6,2,0.66)';c.fillRect(0,240,W,H-240);rays(c,270,520);
  txt(c,"C'EST LA",270,310,52,'#fff',{rot:-0.06,lw:9,shadow:'#d62828'});
  txt(c,'FERMETURE !',270,372,74,'#ffd23f',{rot:-0.04,lw:11,shadow:'#d62828'});
  rrPath(c,70,420,400,226,24);ink(c,'rgba(255,248,230,0.96)',5);
  txt(c,'SCORE',270,454,30,'#d62828',{lw:0});
  txt(c,String(G.score),270,512,78,'#ffd23f',{lw:11});
  txt(c,'VERRES SERVIS : '+G.served,270,574,27,INK,{lw:0});
  txt(c,'RECORD : '+G.best,270,612,27,'#1e4fd8',{lw:0});
  if(G.newBest&&Math.sin(t*10)>-0.3)txt(c,'NOUVEAU RECORD !',270,694,42,'#ff3df0',{rot:-0.06,lw:9});
  button(c,'REMETS-MOI ÇA !',800,'#ff4b2b',G.st>1);
  c.restore();
}
function drawCamZone(c){
  c.fillStyle='#000';c.fillRect(0,0,W,240);
  c.save();c.setLineDash([10,8]);c.strokeStyle='rgba(255,255,255,0.14)';c.lineWidth=2;c.strokeRect(8,8,W-16,224);c.restore();
  txt(c,'ZONE CAMÉRA',270,120,30,'rgba(255,255,255,0.13)',{lw:0});
}

/* ---------- game flow ---------- */
function newGame(){
  Object.assign(G,{score:0,lives:3,combo:1,round:0,puddle:0,served:0,newBest:false,shake:0});
  parts=[];B=null;SFX.start();newRound();
  if(window.JohnnyPMU)JohnnyPMU.debutPartie();
}
function newRound(){
  G.round++;const n=G.round;
  R.dose=rnd(0.10,0.145);R.T=Math.min(0.88,R.dose*6);
  R.h=Math.max(0.022,0.065-0.004*(n-1));
  R.rate=Math.min(0.62,0.30*(1+0.06*(n-1)));
  R.wA=n<4?0:Math.min(0.75,0.15+0.06*(n-4));R.wW=3+n*0.35;
  R.double=n>=6;R.warned=false;
  G.level=0;G.flow=0;G.holding=false;G.overflowed=false;G.off=-430;G.st=0;G.state='enter';G.idleT=0;
  if(n===1)say('idle','happy');
  if(n===6){B={text:'JOHNNY VOIT DOUBLE !',color:'#a14dff',t:0,dur:1.6,sub:''};say('double','disgust');}
  if(n===10){B={text:'LA MAIN QUI TREMBLE !',color:'#ff8a1f',t:0,dur:1.6,sub:''};say('shake','angry');}
}
function evaluate(){
  const d=G.level-R.T,ad=Math.abs(d);let tier;
  if(G.overflowed)tier='over';else if(ad<=R.h*0.15)tier='pile';else if(ad<=R.h*0.45)tier='perfect';else if(ad<=R.h)tier='good';else tier=d<0?'little':'much';
  let pts=0;G.served++;
  if(tier==='pile'){pts=200*G.combo;G.combo=Math.min(10,G.combo+1);B={text:'PILE POIL !',color:'#ff3df0'};confetti(90);SFX.pile();say('pile','happy');}
  else if(tier==='perfect'){pts=100*G.combo;G.combo=Math.min(10,G.combo+1);B={text:'PARFAIT !',color:'#ffd23f'};confetti(55);SFX.perfect();say('perfect','happy');}
  else if(tier==='good'){pts=50*G.combo;B={text:'PAS MAL !',color:'#35d65a'};SFX.good();say('good','neutral');}
  else{G.lives--;G.combo=1;G.shake=14;SFX.fail();
    if(tier==='over'){B={text:'ÇA DÉBORDE !',color:'#ff3b3b'};say('over','angry');SFX.over();}
    else if(tier==='little'){B={text:"C'EST DU SIROP !",color:'#ff8a1f'};say('little','disgust');}
    else{B={text:'TROP DE FLOTTE !',color:'#3fa9ff'};say('much','disgust');}}
  B.t=0;B.dur=1.8;B.sub=pts?'+'+pts:'';
  if(pts){G.score+=pts;G.bump=1;}
  G.state='result';G.st=0;
}
function endGame(){
  G.state='over';G.st=0;
  if(G.score>G.best){G.best=G.score;G.newBest=true;try{localStorage.setItem('ricardParfait.best',String(G.best));}catch(e){}}
  say('end','angry',3);
  if(window.JohnnyPMU)JohnnyPMU.finDePartie();
  const scoreFinal=G.score;
  if(window.JohnnyClassement)setTimeout(()=>{if(G.state==='over')JohnnyClassement.finDePartie('ricard-parfait',scoreFinal);},1400);
}
function press(){
  initAudio();if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
  if(!musicStarted)startMusic();
  if(G.state==='title'){newGame();return;}
  if(G.state==='over'){if(G.st>1)newGame();return;}
  if(G.state==='ready'){G.state='pouring';G.holding=true;}
}
function release(){G.holding=false;if(G.state==='pouring')G.state='settle';}
cv.addEventListener('pointerdown',e=>{e.preventDefault();press();});
addEventListener('pointerup',release);addEventListener('pointercancel',release);
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();press();}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter')release();});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function update(dt){
  t+=dt;G.st+=dt;
  J.talk-=dt;J.lineAge+=dt;J.moodT-=dt;if(J.moodT<=0)J.mood='neutral';if(J.lineAge>3.6&&G.state!=='over')J.line='';
  J.jump=Math.max(0,J.jump-dt*4);
  J.hic-=dt;if(J.hic<=0){J.hic=rnd(5,11);if(G.state!=='result'){J.jump=1;floatText('HIPS !',505,330,'#fff',30);SFX.hips();}}
  neonT-=dt;if(neonT<=0){neonOn=Math.random()<0.85;neonT=neonOn?rnd(0.4,2.8):rnd(0.04,0.15);}
  bT-=dt;if(bT<=0){bOn=!bOn;bT=bOn?rnd(0.05,0.4):rnd(0.05,0.25);}
  G.shake=Math.max(0,G.shake-dt*30);G.bump=Math.max(0,G.bump-dt*3);
  if(B)B.t+=dt;

  if(G.state==='enter'){
    const k=clamp(G.st/0.55,0,1);G.off=lerp(-430,0,easeOutBack(k));G.level=R.dose*Math.min(1,k*1.3);
    if(k>=1){G.off=0;G.level=R.dose;G.state='ready';G.st=0;SFX.pop();}
  }
  if(G.state==='ready'){G.idleT+=dt;if(G.idleT>5){G.idleT=-3;say('wait','angry');}}
  if(G.state==='ready'||G.state==='pouring'||G.state==='settle'){
    const target=G.holding?1:0;
    G.flow+=(target-G.flow)*Math.min(1,dt*(G.holding?6:13));
    if(!G.holding&&G.flow<0.01)G.flow=0;
    const mul=Math.max(0.15,1+R.wA*Math.sin(t*R.wW));
    G.level+=R.rate*G.flow*mul*dt;
    const ly=YB-Math.min(1,G.level)*IH;
    if(G.flow>0.2&&Math.random()<G.flow*0.9)parts.push({k:'drop',x:GX+6+rnd(-6,6),y:ly,vx:rnd(-90,90),vy:rnd(-160,-50),life:0.35,s:rnd(2,4),c:'rgba(235,248,255,0.9)'});
    if(G.level>1){const sp=G.level-1;G.level=1;G.overflowed=true;G.puddle+=sp*0.6;
      for(let i=0;i<3;i++){const side=Math.random()<0.5?-1:1;const col=mixc(AMBER,LOUCHE,liqMix());
        parts.push({k:'drop',x:GX+side*68,y:576,vx:side*rnd(30,110),vy:rnd(-60,20),life:1.2,s:rnd(3,6),c:rgba(col,0.9),ground:true});}}
    if(G.state==='pouring'&&!R.warned&&G.level>R.T+R.h*0.7){R.warned=true;say('stop','angry',1.2);}
    if(G.state==='settle'&&G.flow===0)evaluate();
  }
  if(G.state==='result'&&G.st>1.9){G.state='exit';G.st=0;}
  if(G.state==='exit'){const k=clamp(G.st/0.4,0,1);G.off=lerp(0,560,k*k);if(k>=1){if(G.lives<=0)endGame();else newRound();}}
  updateParts(dt);
  if(pourGain&&AC){const on=(G.state==='pouring'||G.state==='settle')?1:0;
    pourGain.gain.setTargetAtTime(G.flow*0.16*on,AC.currentTime,0.03);
    pourFilter.frequency.setTargetAtTime(600+G.level*2400,AC.currentTime,0.05);}
}
function draw(){
  const c=ctx;c.setTransform(S*DPR,0,0,S*DPR,0,-TOP*S*DPR);
  c.fillStyle='#140a06';c.fillRect(0,0,W,H);
  c.save();c.beginPath();c.rect(0,240,W,H-240);c.clip();
  if(G.shake>0)c.translate(rnd(-1,1)*G.shake,rnd(-1,1)*G.shake);
  c.drawImage(bgBack,0,0,W,H);
  drawTV(c);drawNeon(c);
  drawJohnny(c);
  c.drawImage(bgFront,0,0,W,H);
  drawJohnnyArm(c);
  drawPuddle(c);
  const playing=G.state!=='title';
  if(playing){
    const gx=GX+G.off;
    if(R.double&&G.state!=='over'){const go=12+Math.sin(t*1.7)*10;drawGlass(c,gx+go,0.35);drawGauge(c,gx+96+go,0.3);}
    drawGlass(c,gx,1);
    const ga=R.double?0.55+0.45*Math.abs(Math.sin(t*2.2)):1;
    drawGauge(c,gx+96,ga);
  }else drawGlass(c,GX,1);
  drawStream(c);drawCarafe(c);
  drawParts(c);
  drawFly(c);
  drawLight(c);
  if(G.state!=='title'&&G.state!=='over'){drawBubble(c);drawBurst(c);drawHUD(c);}
  c.restore();
  if(G.state==='title')drawTitle(c);
  if(G.state==='over'){drawOver(c);}
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
G.level=0.12;R.dose=0.12;
requestAnimationFrame(loop);
})();
</script>
