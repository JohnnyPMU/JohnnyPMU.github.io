/* ---------- utils ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let r=Math.imul(a^a>>>15,1|a);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296;}}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const easeOutBack=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);};
function rrPath(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function ink(c,fill,lw=4){if(fill){c.fillStyle=fill;c.fill();}c.lineWidth=lw;c.strokeStyle=INK;c.lineJoin='round';c.lineCap='round';c.stroke();}
function txt(c,s,x,y,size,fill,o={}){
  c.save();c.translate(x,y);if(o.rot)c.rotate(o.rot);
  c.font=size+'px '+FONT;c.textAlign=o.align||'center';c.textBaseline='middle';c.lineJoin='round';
  if(o.max){const w=c.measureText(s).width;if(w>o.max){const k=o.max/w;c.scale(k,k);}}
  const lw=o.lw!=null?o.lw:size*0.18;
  if(o.shadow){c.lineWidth=lw;c.strokeStyle=o.shadow;c.strokeText(s,5,6);c.fillStyle=o.shadow;c.fillText(s,5,6);}
  c.lineWidth=lw;c.strokeStyle=o.stroke||INK;if(lw>0)c.strokeText(s,0,0);c.fillStyle=fill;c.fillText(s,0,0);
  c.restore();
}
function halftone(c,alpha,w=W){
  const p=document.createElement('canvas');p.width=p.height=9;const pc=p.getContext('2d');
  pc.fillStyle='#000';pc.beginPath();pc.arc(4.5,4.5,1.5,0,7);pc.fill();
  c.save();c.globalAlpha=alpha;c.fillStyle=c.createPattern(p,'repeat');c.fillRect(0,0,w,H);c.restore();
}
function starPath(c,n,r1,r2){c.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=i*Math.PI/n-Math.PI/2;c.lineTo(Math.cos(a)*r*(i%4===0?1.08:1),Math.sin(a)*r);}c.closePath();}
function wrap(c,s,max){const w=s.split(' '),out=[];let line='';for(const word of w){const tl=line?line+' '+word:word;if(c.measureText(tl).width>max&&line){out.push(line);line=word;}else line=tl;}if(line)out.push(line);return out;}

/* ---------- audio ---------- */
let AC=null,noiseBuf=null,windGain=null,windF=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    const len=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function beep(f,dur,type='square',vol=0.1,slide=0,delay=0){
  if(!AC)return;
  try{const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+dur+0.05);}catch(e){}
}
function noise(dur,vol,freq=1000,delay=0,type='lowpass'){
  if(!AC||!noiseBuf)return;
  try{const t0=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t0);s.stop(t0+dur+0.05);}catch(e){}
}
function burp(){
  if(!AC)return;
  try{const t0=AC.currentTime+0.12,o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain(),f=AC.createBiquadFilter();
  o.type='sawtooth';o.frequency.setValueAtTime(120,t0);o.frequency.exponentialRampToValueAtTime(65,t0+0.6);
  lfo.frequency.value=26;lg.gain.value=28;lfo.connect(lg).connect(o.frequency);
  f.type='lowpass';f.frequency.value=800;
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.3,t0+0.05);g.gain.exponentialRampToValueAtTime(0.001,t0+0.65);
  o.connect(f).connect(g).connect(AC.destination);o.start(t0);lfo.start(t0);o.stop(t0+0.7);lfo.stop(t0+0.7);}catch(e){}
}
/* ---------- musique (même morceau que Fayot Airlines), lancée au coup de pied ---------- */
const MUSIC=new Audio('musique.mp3');MUSIC.loop=true;MUSIC.preload='auto';
const MUSIC_VOL=0.35;
let musicOn=true,musicLinked=false,musicWanted=false;
try{musicOn=localStorage.getItem('retourCasbah.musique')!=='off';}catch(e){}
function linkMusic(){
  if(musicLinked||!AC)return;
  try{const s=AC.createMediaElementSource(MUSIC),g=AC.createGain();g.gain.value=MUSIC_VOL;s.connect(g).connect(AC.destination);musicLinked=true;}
  catch(e){MUSIC.volume=MUSIC_VOL;}
}
function musicPlay(fromStart){
  musicWanted=true;if(!musicOn)return;
  linkMusic();if(!musicLinked)MUSIC.volume=MUSIC_VOL;
  if(fromStart){try{MUSIC.currentTime=0;}catch(e){}}
  MUSIC.play().catch(()=>{});
}
function musicStop(){musicWanted=false;MUSIC.pause();}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)MUSIC.pause();else if(musicOn&&musicWanted)MUSIC.play().catch(()=>{});
});
(function(){
  const b=document.createElement('button');b.id='btnMusique';b.type='button';
  const st=document.createElement('style');
  st.textContent='#btnMusique{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:50;width:46px;height:46px;border-radius:50%;'+
    'border:2px solid #1b0f0c;background:#f5f1e6;box-shadow:0 3px 0 #1b0f0c,0 4px 12px rgba(0,0,0,.5);display:grid;place-items:center;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}'+
    '#btnMusique svg{width:26px;height:26px}#btnMusique:active{transform:translateY(2px);box-shadow:0 1px 0 #1b0f0c}';
  document.head.appendChild(st);
  const draw=()=>{b.setAttribute('aria-label',musicOn?'Couper la musique':'Remettre la musique');
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#1b0f0c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="#d62828"/><circle cx="17" cy="16" r="3" fill="#d62828"/>'+
      (musicOn?'':'<path d="M3 3l18 18" stroke="#d62828" stroke-width="3"/>')+'</svg>';};
  draw();
  ['pointerdown','mousedown','touchstart','keydown'].forEach(t=>b.addEventListener(t,e=>e.stopPropagation()));
  b.addEventListener('click',e=>{e.stopPropagation();
    musicOn=!musicOn;try{localStorage.setItem('retourCasbah.musique',musicOn?'on':'off');}catch(err){}
    if(musicOn){initAudio();if(musicWanted)musicPlay(false);}else MUSIC.pause();
    draw();});
  document.body.appendChild(b);
})();
const SFX={
  kick(){noise(0.25,0.6,700);beep(150,0.28,'sine',0.4,0.4);},
  boing(){beep(200,0.4,'sine',0.25,3.2);},

  beer(){beep(500,0.08,'triangle',0.14,1.8);beep(800,0.12,'triangle',0.12,1.4,0.07);},
  boost(){[320,380,440,520,620].forEach((f,i)=>beep(f,0.06,'triangle',0.1,1.3,i*0.05));},
  bark(){beep(430,0.09,'sawtooth',0.12,0.6);beep(390,0.1,'sawtooth',0.12,0.6,0.15);},
  crash(){noise(0.4,0.5,1500);beep(90,0.4,'square',0.12,0.5);},
  thud(){},
  splash(){noise(0.5,0.4,2200,0,'bandpass');},
  whistle(){beep(2300,0.12,'square',0.05);beep(2300,0.35,'square',0.05,0,0.18);},
  snore(){beep(110,0.7,'sawtooth',0.07,0.8);beep(140,0.6,'sawtooth',0.05,1.3,0.8);},
  jackpot(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>beep(f,0.2,'square',0.08,0,i*0.09));},
  good(){[523,659,784].forEach((f,i)=>beep(f,0.15,'square',0.07,0,i*0.08));},
  fail(){beep(260,0.55,'sawtooth',0.1,0.35);},

};

/* ---------- state ---------- */
const G={state:'title',st:0,z:1,kpos:0,combo:0,cbump:0,try:0,scores:[],best:0,newBest:false,shake:0,camX:0,camY:0,idle:0,
  dlg:null,dlgI:0,dlgT:0,dlgOn:false,phase:0.5,pos:0,kq:0,res:null,bub:null,hint:0};
const J={x:240,y:GY-62,px:240,vx:0,vy:0,rot:0,dir:-1,walk:0,beers:0,pts:0,ground:false,done:false,vis:true,
  drink:0,arrested:false,inPuddle:false,sleep:false,hic:5,jump:0,zz:0};
const F={kickT:-1,talk:0};
let parts=[],B=null,LV={objs:[],items:[]};
try{G.best=parseInt(localStorage.getItem('retourCasbah.best')||'0',10)||0;}catch(e){}

const DLG1=[['f',"T'AS VU L'HEURE, JOHNNY ?!"],['j',"CHÉRIE... JE PEUX TOUT T'EXPLIQUER... HIPS !"],['f',"TU L'AIMES TANT TON PMU ? ALORS DÉGAGE !"]];
const DLGN=[
  [['f',"ENCORE TOI ?! T'ES REVENU ?!"],['j',"BABY... J'AI OUBLIÉ MES CLÉS..."]],
  [['j',"HONEY, I'M HOME ! HIPS !"],['f',"PAS POUR LONGTEMPS, COWBOY !"]],
  [['f',"TU DORMIRAS PAS ICI CE SOIR !"],['j',"C'EST LA DERNIÈRE FOIS, PROMIS, BABY !"]]
];

const VAL={coin:10,coaster:25,ticket:50,horse:100};

/* ---------- level ---------- */
function genLevel(seed){
  const r=mulberry(seed),objs=[],items=[];
  let x=950;
  while(x<PMU_X-380){
    const k=r();let type;
    if(k<0.13)type='trash';else if(k<0.22)type='dog';else if(k<0.30)type='puddle';else if(k<0.42)type='tramp';
    else if(k<0.50)type='fan';else if(k<0.60)type='car';else if(k<0.67)type='cannon';else if(k<0.74)type='cart';
    else if(k<0.88)type='lamp';else if(k<0.92)type='sewer';else if(k<0.96)type='cop';else type='bench';
    objs.push({type,x,used:false,anim:0,cd:0});
    x+=(type==='car'?300:220)+r()*300;
  }
  items.push({type:'beer',x:1000,y:GY-260});
  x=650;
  while(x<PMU_X-200){
    const k=r(),y=GY-130-r()*360;
    if(k<0.05)items.push({type:'gold',x,y:y-60});
    else if(k<0.19){if(Math.abs(x-1000)>150)items.push({type:'beer',x,y});}
    else if(k<0.46){const n=4+(r()*3|0);for(let i=0;i<n;i++)items.push({type:'coin',x:x+i*44,y:y-Math.sin(i/(n-1)*Math.PI)*50});x+=n*44;}
    else if(k<0.72)items.push({type:'coaster',x,y});
    else if(k<0.87)items.push({type:'ticket',x,y});
    else items.push({type:'horse',x,y:GY-430-r()*160});
    x+=190+r()*250;
  }
  return {objs,items};
}

/* ---------- pre-rendered backgrounds ---------- */
function drawFar(c){
  const r=mulberry(21),cols=['#2a2150','#30265a','#241c46'];let x=0;
  while(x<TW){
    let w=50+r()*90;if(TW-x<70||x+w>TW)w=TW-x;
    const h=150+r()*250;
    c.beginPath();c.rect(x,GY-h,w,H);c.fillStyle=cols[(r()*3)|0];c.fill();c.strokeStyle='rgba(10,5,20,0.7)';c.lineWidth=2;c.stroke();
    if(r()<0.3){c.fillStyle=cols[0];c.fillRect(x+w*0.4,GY-h-24,4,24);}
    for(let yy=GY-h+14;yy<GY-20;yy+=22)for(let xx=x+8;xx<x+w-10;xx+=16)if(r()<0.16){c.fillStyle='rgba(255,210,110,0.55)';c.fillRect(xx,yy,7,10);}
    x+=w;
  }
  halftone(c,0.07,TW);
}
function drawMid(c){
  const r=mulberry(33),cols=['#9b6b45','#7d5a6e','#6c6f80','#a07a4a','#8f4f45','#5f7a6a'];
  const shops=['BOULANGERIE','KEBAB','PRESSING','COIFFURE','BOUCHERIE','LAVERIE','FRITERIE','PHARMACIE'];
  let x=0,i=0;
  while(x<TW){
    let w=170+r()*90;if(TW-x-w<170)w=TW-x;
    const h=300+r()*170,top=GY-h,col=cols[(r()*cols.length)|0];
    c.beginPath();c.rect(x,top,w,H-top);ink(c,col,4);
    c.fillStyle='rgba(0,0,0,0.25)';c.fillRect(x+2,top+2,w-4,10);
    if(r()<0.6){rrPath(c,x+w*0.7,top-30,22,32,3);ink(c,'#5a3a2a',3);}
    const nc=Math.max(2,Math.floor((w-30)/62)),ww=34,wh=46,gap=(w-nc*ww)/(nc+1);
    for(let yy=top+34;yy<GY-200;yy+=78)for(let k=0;k<nc;k++){
      const wx=x+gap+k*(ww+gap),lit=r()<0.35;
      c.fillStyle='rgba(30,20,20,0.5)';c.fillRect(wx-9,yy,8,wh);c.fillRect(wx+ww+1,yy,8,wh);
      rrPath(c,wx,yy,ww,wh,3);ink(c,lit?'#ffd86b':'#26304a',3);
      if(lit){c.fillStyle='rgba(255,150,60,0.35)';c.fillRect(wx+3,yy+wh*0.55,ww-6,wh*0.4);}
      c.strokeStyle=INK;c.lineWidth=2;c.beginPath();c.moveTo(wx+ww/2,yy);c.lineTo(wx+ww/2,yy+wh);c.moveTo(wx,yy+wh*0.45);c.lineTo(wx+ww,yy+wh*0.45);c.stroke();
      c.fillStyle='#d8cbb0';c.fillRect(wx-4,yy+wh,ww+8,5);
    }
    const sy=GY-150;
    rrPath(c,x+12,sy+44,w-24,106,4);ink(c,'#1d2433',4);
    c.fillStyle='rgba(255,220,140,0.22)';c.fillRect(x+16,sy+48,w-32,100);
    const aw=['#d62828','#2f8f3a','#1e4fd8'][(r()*3)|0];
    c.save();c.beginPath();c.moveTo(x+8,sy+10);c.lineTo(x+w-8,sy+10);c.lineTo(x+w,sy+44);c.lineTo(x,sy+44);c.closePath();
    c.save();c.clip();for(let sx=x;sx<x+w;sx+=36){c.fillStyle=aw;c.fillRect(sx,sy,18,50);c.fillStyle='#f5f1e6';c.fillRect(sx+18,sy,18,50);}c.restore();
    ink(c,null,3.5);c.restore();
    rrPath(c,x+20,sy-30,w-40,32,6);ink(c,'#f5e6c0',3);
    txt(c,shops[i%shops.length],x+w/2,sy-13,22,'#8b1b12',{lw:0,max:w-56});
    x+=w;i++;
  }
  halftone(c,0.08,TW);
}
function buildBG(){
  [[farT,drawFar],[midT,drawMid]].forEach(([cn,fn])=>{cn.width=Math.round(TW*S*DPR);cn.height=Math.round(H*S*DPR);const c=cn.getContext('2d');c.setTransform(S*DPR,0,0,S*DPR,0,0);fn(c);});
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  S=Math.min(innerWidth/W,innerHeight/VH);
  cv.style.width=Math.round(W*S)+'px';cv.style.height=Math.round(VH*S)+'px';
  cv.width=Math.round(W*S*DPR);cv.height=Math.round(VH*S*DPR);
  buildBG();
}
addEventListener('resize',resize);resize();
if(document.fonts&&document.fonts.load){document.fonts.load('40px Bangers').then(()=>buildBG()).catch(()=>{});}

/* ---------- sky / ground / tiles ---------- */
const STARS=(()=>{const r=mulberry(9),a=[];for(let i=0;i<55;i++)a.push([r()*W,250+r()*420,0.8+r()*1.6,r()*6]);return a;})();
function drawSky(c){
  const g=c.createLinearGradient(0,240,0,H);g.addColorStop(0,'#0d0b2b');g.addColorStop(0.6,'#3b2a63');g.addColorStop(1,'#8a4a6a');
  c.fillStyle=g;c.fillRect(0,240,W,H-240);
  STARS.forEach(([x,y,s,p])=>{c.fillStyle=`rgba(255,255,230,${0.4+0.4*Math.sin(t*2+p)})`;c.fillRect(x,y+G.camY*0.05,s,s);});
  const mx=430-G.camX*0.01,my=350+G.camY*0.08;
  c.save();c.globalCompositeOperation='lighter';const mg=c.createRadialGradient(mx,my,20,mx,my,120);mg.addColorStop(0,'rgba(255,240,180,0.3)');mg.addColorStop(1,'rgba(255,240,180,0)');c.fillStyle=mg;c.fillRect(mx-130,my-130,260,260);c.restore();
  c.beginPath();c.arc(mx,my,34,0,7);ink(c,'#fff3c4',4);
  c.fillStyle='rgba(200,180,120,0.5)';c.beginPath();c.arc(mx-10,my-8,7,0,7);c.arc(mx+12,my+10,5,0,7);c.fill();
}
function drawTile(c,tile,par){
  const ox=-((G.camX*par)%TW),oy=G.camY*par;
  for(let x=ox;x<W/G.z;x+=TW)c.drawImage(tile,x,oy,TW,H);
}
function drawGround(c){
  const x0=G.camX-20,x1=G.camX+W/G.z+20;
  c.fillStyle='#8d8a86';c.fillRect(x0,GY,x1-x0,24);
  c.strokeStyle='rgba(40,30,30,0.5)';c.lineWidth=2;
  for(let x=Math.floor(x0/64)*64;x<x1;x+=64){c.beginPath();c.moveTo(x,GY);c.lineTo(x-6,GY+24);c.stroke();}
  c.fillStyle=INK;c.fillRect(x0,GY-2,x1-x0,4);
  c.fillStyle='#c9c4bb';c.fillRect(x0,GY+24,x1-x0,8);c.fillStyle=INK;c.fillRect(x0,GY+32,x1-x0,3);
  c.fillStyle='#2f2f38';c.fillRect(x0,GY+35,x1-x0,800);
  c.fillStyle='#e8e2d0';for(let x=Math.floor(x0/160)*160;x<x1;x+=160)c.fillRect(x,GY+70,70,7);
}

/* ---------- house & PMU ---------- */
function drawHouse(c){
  if(G.camX>400)return;
  c.beginPath();c.rect(-500,GY-420,650,420);ink(c,'#d8b98a',5);
  c.beginPath();c.moveTo(-520,GY-420);c.lineTo(172,GY-420);c.lineTo(152,GY-462);c.lineTo(-500,GY-462);c.closePath();ink(c,'#7a3a2a',4);
  // window upstairs
  rrPath(c,22,GY-370,84,84,4);ink(c,'#ffd86b',4);

/* ---------- particles ---------- */
function addP(o){o.max=o.life;parts.push(Object.assign({vx:0,vy:0,g:0,s:6,grow:0,r:0,vr:0},o));}
function floatText(s,x,y,col,size=40){addP({k:'text',x,y,vy:-70,life:1.3,s:size,c:col,txt:s});}
function confetti(n){const cols=['#ff3df0','#ffd23f','#35d65a','#3fa9ff','#ff4b2b','#fff'];
  for(let i=0;i<n;i++)addP({k:'conf',x:G.camX+270/G.z,y:GY-(GY-480)/G.z-G.camY,vx:rnd(-380,380),vy:rnd(-650,-150),g:900,r:rnd(0,6),vr:rnd(-12,12),life:rnd(1.2,2),c:pick(cols),s:rnd(6,12)});}
function puff(x,y,n,col,spd=160){for(let i=0;i<n;i++)addP({k:'dot',x,y,vx:rnd(-spd,spd),vy:rnd(-spd,spd*0.3),life:rnd(0.4,0.8),s:rnd(6,12),grow:24,c:col});}
function updateParts(dt){
  for(const p of parts){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.s+=p.grow*dt;p.r+=p.vr*dt;if(p.k==='conf')p.vx*=0.99;}
  parts=parts.filter(p=>p.life>0);
}
function drawParts(c){
  for(const p of parts){
    const k=p.life/p.max;
    if(p.k==='conf'){c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore();}
    else if(p.k==='dot'){c.save();c.globalAlpha=k;c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.s,0,7);c.fill();c.restore();}
    else if(p.k==='star'){c.save();c.globalAlpha=Math.min(1,k*2);c.translate(p.x,p.y);c.rotate(p.r);starPath(c,5,p.s,p.s*0.45);ink(c,p.c,2);c.restore();}
    else if(p.k==='text'){c.save();c.globalAlpha=Math.min(1,k*2);txt(c,p.txt,p.x,p.y,p.s*(1+(1-k)*0.2),p.c,{lw:7});c.restore();}
  }
}

function stop(reason){
  if(J.done)return;J.done=true;G.qte=null;G.state='stopped';G.st=0;
  let m=reason==='door'?Math.round((PMU_X+48-START_X)/10):distM();
  let bonus=0;if(reason==='door')bonus=1000;else if(J.x>=PMU_X-150)bonus=400;
  const keep=J.beers*20,tot=m+J.pts+bonus+keep;
  G.res={m,pts:J.pts,bonus,keep,tot,reason};G.scores.push(tot);
  if(reason==='door'){B={text:'EN PLEIN DANS LE PMU !',color:'#ff3df0',sub:'JACKPOT !'};J.vis=false;confetti(120);SFX.jackpot();puff(PMU_X+48,GY-90,20,'rgba(255,230,140,0.8)',260);}
  else if(reason==='sewer'){B={text:'PLOUF !',color:'#3fa9ff',sub:''};J.vis=false;SFX.splash();G.shake=10;puff(J.x,GY,18,'rgba(120,170,90,0.8)',200);}
  else if(reason==='cop'){B={text:'EMBARQUÉ !',color:'#3fa9ff',sub:m+' M'};SFX.fail();}
  else if(reason==='bench'){B={text:'IL ROUPILLE...',color:'#a14dff',sub:m+' M'};SFX.snore();}
  else if(bonus){B={text:'DEVANT LE PMU !',color:'#ffd23f',sub:'+'+bonus};confetti(60);SFX.good();}
  else{B={text:m+' MÈTRES',color:m>=300?'#35d65a':m>=150?'#ffd23f':'#ff8a1f',sub:''};m>=150?SFX.good():SFX.fail();}
  B.t=0;B.dur=1.7;
}
function endGame(){
  G.state='over';G.st=0;musicStop();const fin=Math.max(0,...G.scores);
  if(fin>G.best){G.best=fin;G.newBest=true;try{localStorage.setItem('retourCasbah.best',String(G.best));}catch(e){}}
  if(window.JohnnyPMU)JohnnyPMU.finDePartie();
  G.topEnAttente=!!window.JohnnyClassement;
  if(G.topEnAttente)setTimeout(()=>{
    try{JohnnyClassement.finDePartie('retour-a-la-casbah',fin,{surFermeture:()=>{G.topEnAttente=false;G.st=Math.min(G.st,0.6);}});}
    catch(e){G.topEnAttente=false;}
  },800);
}
function press(x,y){
  initAudio();if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
  if(G.state==='title'){newGame();return;}
  if(G.state==='intro'){goReady();return;}
  if(G.state==='ready'){doKick();return;}
  if(G.state==='fly'){const onBtn=x!=null&&boostVisible()&&Math.hypot(x-BX,y-BY)<BR+30;if(onBtn)boost();else if(G.qte)qteHit();else if(x==null)boost();return;}
  if(G.state==='result'){if(G.st>0.7){if(G.try<TRIES)nextTry();else endGame();}return;}
  if(G.state==='over'){if(G.st>1&&!G.topEnAttente){G.state='title';G.st=0;newGame();}}
}

function updateFly(dt){
  J.px=J.x;
  J.vy+=GRAV*dt;J.x+=J.vx*dt;J.y+=J.vy*dt;
  J.drink=Math.max(0,J.drink-dt);
  if(J.rocket>0){J.rocket-=dt;addP({k:'dot',x:J.x-20,y:J.y+10,vx:rnd(-260,-120),vy:rnd(-40,40),life:0.5,s:rnd(8,14),grow:20,c:pick(['rgba(255,200,60,0.85)','rgba(255,120,40,0.85)','rgba(255,240,150,0.85)'])});}
  if(!J.ground)J.rot+=dt*J.vx/260;
  // ground
  if(J.y>=GY-30){
    J.y=GY-30;
    G.combo=0;
    if(J.vy>170&&!J.arrested){J.vy=-J.vy*0.45;J.vx*=0.78;J.ground=false;SFX.thud();puff(J.x,GY-4,6,'rgba(200,190,170,0.7)',120);}
    else{J.vy=0;J.ground=true;}
  }
  // items
  for(const it of LV.items){
    if(it.got)continue;const bob=Math.sin(t*3+it.x*0.01)*6;
    if(Math.abs(it.x-J.x)<46&&Math.abs(it.y+bob-J.y)<50){
      it.got=true;
      if(it.type==='gold'){megaBoost();}
      else if(it.type==='beer'){J.beers++;G.hint=1.8;SFX.beer();floatText('+1 BIÈRE !',it.x,it.y-30,'#ffd23f',32);}
      else{const v=VAL[it.type];J.pts+=v;SFX.coin();floatText('+'+v,it.x,it.y-24,'#35d65a',it.type==='horse'?44:30);
        for(let i=0;i<5;i++)addP({k:'star',x:it.x,y:it.y,vx:rnd(-160,160),vy:rnd(-160,160),life:0.5,s:rnd(5,9),r:0,vr:rnd(-6,6),c:'#fff6a0'});}
    }
  }
  // objects
  J.inPuddle=false;
  for(const o of LV.objs){
    const dx=J.x-o.x;
    o.cd=Math.max(0,o.cd-dt);
    if(o.type==='puddle'){if(J.ground&&Math.abs(dx)<95){J.inPuddle=true;if(!o.used){o.used=true;SFX.splash();floatText('SPLASH !',o.x,GY-60,'#ffd23f',34);puff(J.x,GY,10,'rgba(240,200,80,0.8)',200);}}continue;}
    if(o.type==='fan'){if(Math.abs(dx)<60&&J.y>GY-460){J.vy=Math.max(-1000,J.vy-4200*dt);J.ground=false;if(!o.used){o.used=true;combo(false);floatText('FIOUUU !',o.x,GY-200,'#dff6ff',40);noise(0.8,0.3,900,0,'bandpass');}}continue;}
    if(o.type==='car'){
      if(o.cd<=0&&Math.abs(dx)<80&&J.y+28>=GY-92&&(J.vy>0||J.ground)){o.cd=0.4;o.used=true;o.anim=1;J.y=GY-92-28;J.vy=-Math.max(900,Math.abs(J.vy)*0.9);J.vx=Math.max(J.vx,350)*1.12;J.ground=false;
        beep(330,0.25,'square',0.08);beep(415,0.25,'square',0.08);floatText('TUUUT !',o.x,GY-150,'#ffd23f',42);combo();}
      continue;
    }
    if(o.used)continue;
    if(o.type==='trash'){
      if(Math.abs(dx)<40&&J.y+28>=GY-78&&(J.vy>0||J.ground)){o.used=true;o.anim=1;J.y=GY-78-28;J.vy=-Math.max(780,Math.abs(J.vy)*0.95);J.vx=Math.max(J.vx,260)*1.08;J.ground=false;SFX.boing();floatText('BOING !',o.x,GY-130,'#ffd23f',42);combo();}
    }else if(o.type==='tramp'){
      if(Math.abs(dx)<64&&J.y+28>=GY-46&&(J.vy>0||J.ground)){o.used=true;o.anim=1;J.y=GY-46-28;J.vy=-Math.max(1150,Math.abs(J.vy)*1.1);J.vx=Math.max(J.vx,350)*1.1;J.ground=false;SFX.boing();beep(300,0.5,'sine',0.2,4);floatText('SUPER JUMP !',o.x,GY-150,'#3fa9ff',46);combo();G.shake=8;}
    }else if(o.type==='cannon'){
      if(Math.abs(dx)<55&&J.y>GY-170){o.used=true;o.anim=1;J.vx=Math.max(J.vx,0)+900;J.vy=-950;J.ground=false;SFX.crash();SFX.jackpot();G.shake=16;floatText('BOUM !',o.x,GY-160,'#ff3df0',56);combo();
        for(let i=0;i<30;i++)addP({k:'conf',x:o.x+40,y:GY-80,vx:rnd(100,700),vy:rnd(-700,-100),g:900,r:rnd(0,6),vr:rnd(-12,12),life:rnd(1,1.6),c:pick(['#ff3df0','#ffd23f','#35d65a','#3fa9ff']),s:rnd(6,12)});}
    }else if(o.type==='cart'){
      if(Math.abs(dx)<50&&J.y>GY-120){o.used=true;J.vx=Math.max(J.vx,1000);J.vy=Math.min(J.vy,-380);J.ground=false;beep(600,0.4,'sawtooth',0.06,2);floatText('WIIIZ !',o.x,GY-130,'#35d65a',44);combo();}
    }else if(o.type==='dog'){
      if(Math.abs(dx)<55&&J.y>GY-150){o.used=true;o.anim=1;J.vy=-700;J.vx=Math.max(J.vx,220)+160;J.ground=false;SFX.bark();floatText('WOUAF !',o.x,GY-110,'#fff',40);combo();}
    }else if(o.type==='lamp'){
      if(J.px<o.x-18&&J.x>=o.x-18&&J.y>GY-275){o.used=true;o.anim=1;J.vx=Math.max(80,J.vx*0.35);J.vy=Math.max(J.vy,40);G.shake=14;SFX.crash();floatText('BONG !',o.x,J.y-60,'#ff8a1f',44);G.combo=0;}
    }else if(o.type==='sewer'){
      if(J.y>=GY-32&&Math.abs(dx)<30){o.used=true;stop('sewer');return;}
    }else if(o.type==='cop'){
      if(Math.abs(dx)<42&&J.y>GY-175){o.used=true;J.arrested=true;J.vx=0;J.vy=Math.max(J.vy,0);SFX.whistle();floatText('VOS PAPIERS !',o.x,GY-210,'#fff',36);G.shake=8;}
    }else if(o.type==='bench'){
      if(J.ground&&Math.abs(dx)<70&&Math.abs(J.vx)<520){o.used=true;J.vx=0;J.sleep=true;stop('bench');return;}
    }
  }
  // PMU door / dead-end wall
  if(J.x>=PMU_X&&J.x<=PMU_X+96&&J.y>GY-175){stop('door');return;}
  if(J.x>=PMU_X+462){J.x=PMU_X+460;J.vx=-90;J.vy=Math.max(J.vy,40);G.shake=12;SFX.crash();floatText('BONG !',J.x,J.y-60,'#ff8a1f',44);}
  // sliding
  if(J.ground){
    const fr=J.arrested?3000:J.inPuddle?110:560,sp=Math.max(0,Math.abs(J.vx)-fr*dt);J.vx=Math.sign(J.vx)*sp;
    const tg=Math.PI/2+Math.PI*2*Math.round((J.rot-Math.PI/2)/(Math.PI*2));J.rot=lerp(J.rot,tg,Math.min(1,dt*8));
    if(sp>200&&Math.random()<0.4)puff(J.x,GY-4,1,'rgba(200,190,170,0.6)',60);
    if(sp<12)stop(J.arrested?'cop':'normal');
  }
}

  J.hic-=dt;if(J.hic<=0){J.hic=rnd(5,10);if(G.state==='intro'||G.state==='ready'||G.state==='title'){J.jump=1;floatText('HIPS !',J.x+10,J.y-130,'#fff',28);SFX.hips();}}
  neonT-=dt;if(neonT<=0){neonOn=Math.random()<0.85;neonT=neonOn?rnd(0.4,2.8):rnd(0.04,0.15);}
  for(const o of LV.objs)o.anim=Math.max(0,o.anim-dt*2.5);

  if(G.state==='intro'){
    if(J.x>200){J.x=Math.max(200,J.x-280*dt);J.walk+=dt*12;J.rot=Math.sin(t*3)*0.06;}
    else{
      J.walk=0;
      if(!G.dlgOn){G.dlgOn=true;G.dlgI=-1;nextLine();}
      G.dlgT-=dt;if(G.dlgT<=0){if(G.dlgI>=G.dlg.length-1)goReady();else nextLine();}
    }
  }else if(G.state==='ready'){
    G.phase+=dt*(0.85+0.2*(G.try-1));const u=G.phase%2;G.pos=u<1?-1+2*u:3-2*u;
    J.x=200+22*G.pos;J.rot=G.pos*0.05;
    G.idle+=dt;if(G.idle>6){G.idle=0;G.bub={who:'j',text:pick(WAIT),age:0};}
  }else if(G.state==='kick'){
    if(G.st>=0.1)launch();
  }else if(G.state==='fly'){
    if(G.qte){G.qte.t+=dt;if(G.qte.t>G.qte.dur){G.qte=null;floatText('TROP TARD !',J.x,J.y-100,'#ff8a1f',30);}}
    updateFly(G.qte?dt*0.4:dt);
  }else if(G.state==='stopped'){
    if(J.sleep){J.zz-=dt;if(J.zz<=0){J.zz=0.6;floatText('Z',J.x+20,J.y-40,'#fff',30);}}
    if(G.st>1.7){G.state='result';G.st=0;}
  }
  // camera
  const zoomOut=G.state==='fly'||G.state==='stopped'||G.state==='result'||G.state==='over';
  G.z+=((zoomOut?ZFLY:1)-G.z)*Math.min(1,dt*3);
  if(zoomOut){
    const tx=clamp(J.x-150/G.z,0,PMU_X+700-W/G.z),ty=Math.max(0,(400-GY)/G.z-(J.y-GY));
    G.camX+=(tx-G.camX)*Math.min(1,dt*20);G.camY+=(ty-G.camY)*Math.min(1,dt*6);
  }
  updateParts(dt);
}
function johnnyPose(){
  if(G.state==='title'||G.state==='intro')return 'walk';
  if(G.state==='ready'||G.state==='kick')return 'bent';
  if(J.drink>0)return 'drink';
  if(J.ground||J.done)return 'lie';
  return 'fly';
}
function draw(){
  const c=ctx;c.setTransform(S*DPR,0,0,S*DPR,0,-CAM*S*DPR);
  c.fillStyle='#140a06';c.fillRect(0,0,W,H);
  c.save();if(G.shake>0)c.translate(rnd(-1,1)*G.shake,rnd(-1,1)*G.shake);
  drawSky(c);
  c.save();c.translate(0,GY);c.scale(G.z,G.z);c.translate(0,-GY);
  drawTile(c,farT,0.2);drawTile(c,midT,0.55);
  c.translate(-G.camX,G.camY);
  const vw=W/G.z;
  drawGround(c);drawHouse(c);drawPMU(c);
  for(const o of LV.objs)if(o.x>G.camX-200&&o.x<G.camX+vw+200)drawObj(c,o);
  for(const it of LV.items)if(!it.got&&it.x>G.camX-60&&it.x<G.camX+vw+60)drawItem(c,it);
  drawWife(c,100,GY-16);
  if(J.vis)drawJ(c,J.x,J.y-J.jump*14,J.rot,johnnyPose(),J.dir,J.walk);
  drawParts(c);
  c.restore();
  drawVignette(c);
  if(G.state!=='title'&&G.state!=='over'){
    drawHUD(c);
    if(G.state==='ready')drawGauge(c);
    drawBubble(c);drawBurst(c);drawBoostBtn(c);drawQte(c);
  }
  c.restore();
  if(G.state==='title')drawTitle(c);
  if(G.state==='result')drawResult(c);
  if(G.state==='over')drawOver(c);
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
